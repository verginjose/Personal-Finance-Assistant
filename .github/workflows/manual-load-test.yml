name: manual-load-test

run-name: Guarded realistic test — ${{ inputs.users }} users, ${{ inputs.bills_total }} bills total

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Virtual sessions (globally paced, at most three active browser journeys)"
        required: true
        type: choice
        default: "10"
        options: ["5", "10", "25", "50"]
      duration_seconds:
        description: "Browsing duration after gradual account setup"
        required: true
        type: choice
        default: "180"
        options: ["120", "180", "300"]
      bills_total:
        description: "Bills across the ENTIRE run; sequential, at least 60s apart"
        required: true
        type: choice
        default: "1"
        options: ["0", "1", "2"]
      confirm_production_test:
        description: "I understand synthetic accounts and ledger rows persist after this test"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize tests with builds: both consume the same laptop's resources.
concurrency:
  group: pfa-host-intensive
  cancel-in-progress: false

jobs:
  load-test:
    name: Realistic journeys with strict laptop guard
    runs-on: [self-hosted, linux, x64, pfa]
    timeout-minutes: 15
    env:
      PFA_USERS: ${{ inputs.users }}
      PFA_DURATION: ${{ inputs.duration_seconds }}
      PFA_BILLS: ${{ inputs.bills_total }}
      PFA_CONFIRM: ${{ inputs.confirm_production_test }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo "::error::Run from master only."; exit 1; }
          [[ "$PFA_CONFIRM" == "true" ]] || { echo "::error::Acknowledge persistent synthetic data."; exit 1; }
          case "$PFA_USERS" in 5|10|25|50) ;; *) exit 1;; esac
          case "$PFA_DURATION" in 120|180|300) ;; *) exit 1;; esac
          case "$PFA_BILLS" in 0|1|2) ;; *) exit 1;; esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            requests/run_realistic_test.py
            requests/laptop_guard.py
            requests/large-receipt-image-dataset-SRD/1131-receipt.jpg

      - name: Run only under fresh laptop telemetry
        shell: bash
        run: |
          set -uo pipefail
          guard="$RUNNER_TEMP/pfa-guard.json"
          report="$RUNNER_TEMP/pfa-realistic.json"
          log="$RUNNER_TEMP/pfa-realistic.log"
          trap 'rm -f "$guard" "$report" "$log"' EXIT
          python3 requests/laptop_guard.py run --pause-ocr-on-abort --report "$guard" -- \
            python3 requests/run_realistic_test.py \
              --users "$PFA_USERS" --duration "$PFA_DURATION" \
              --bills-total "$PFA_BILLS" --rps 1 --out "$report" >"$log" 2>&1
          result=$?
          python3 - "$guard" "$report" "$GITHUB_STEP_SUMMARY" <<'PYTHON'
          import json, pathlib, sys
          result = {}
          for name, filename in zip(('laptop_guard', 'scenario'), sys.argv[1:3]):
              path = pathlib.Path(filename)
              result[name] = json.loads(path.read_text()) if path.exists() else {'verdict': 'NOT_RUN'}
          samples = result['laptop_guard'].pop('recent_samples', [])
          pathlib.Path(sys.argv[3]).write_text(
              '## Guarded realistic PFA test\n\n'
              'Hardware limits are mandatory; missing or stale telemetry stops traffic.\n\n'
              'Synthetic application data persists.\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n'
              '\n<details><summary>Timestamped hardware samples</summary>\n\n```json\n'
              + json.dumps(samples, indent=2) + '\n```\n</details>\n')
          PYTHON
          exit "$result"
