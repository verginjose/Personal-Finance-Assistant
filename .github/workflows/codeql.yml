# Advanced CodeQL setup. Default setup cannot drop java-kotlin through the REST
# API without also dropping the (API-unlisted) rust analysis, so the languages
# are declared here instead. Rust is analysed with build-mode=none, the only
# mode its extractor offers.
name: CodeQL

on:
  push:
    branches: ["master", "k8s/local-deployment"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
