# Build changed services on the in-cluster self-hosted runner, push them to the
# in-cluster registry, and point the Deployment at the new immutable tag.
#
# Replaces the manual `./k8s/build-images.sh` + `docker save | k3s ctr images
# import` flow. See k8s/ci/README.md for the one-time setup.
name: build-and-deploy

on:
  push:
    branches: ["master", "k8s/local-deployment"]
    paths-ignore:
      - "**.md"
      - "k8s/ci/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build, or 'all' to backfill every image"
        required: true
        default: all
        type: choice
        options: [all, api-gateway, command-service, query-service, frontend, ocr-service]

# The job pushes the tag bump back to the same repo.
permissions:
  contents: write

# Never run two builds at once: a Maven build and an OCR build together will
# exceed the node's memory, and the tag-bump commits would race.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  REGISTRY: 192.168.0.7:30500
  BUILDKIT_HOST: tcp://buildkitd.pfa.svc.cluster.local:1234
  BUILDKIT_VERSION: v0.15.2
  ALL_SERVICES: api-gateway command-service query-service frontend ocr-service

jobs:
  detect:
    runs-on: [self-hosted, linux, x64, pfa]
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine services to build
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          selected=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_SERVICE" == "all" ]]; then
              selected="$ALL_SERVICES"
            else
              selected="$INPUT_SERVICE"
            fi
          else
            changed_files="$(git diff --name-only HEAD^ HEAD)"
            for svc in $ALL_SERVICES; do
              if printf '%s\n' "$changed_files" | grep -q "^${svc}/"; then
                selected="$selected $svc"
              fi
            done
          fi
          selected="$(echo $selected)"   # trim leading space
          json="[]"
          if [[ -n "$selected" ]]; then
            json="[$(printf '%s\n' $selected | sed 's/.*/"&"/' | paste -sd, -)]"
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Selected: $json"

  build:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: [self-hosted, linux, x64, pfa]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch tip, not github.sha. Every matrix job would
          # otherwise branch from the same triggering commit and their
          # tag-bump pushes would conflict with each other.
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # the tag-bump commit is pushed from this checkout

      - name: Install buildctl if missing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          if ! command -v buildctl >/dev/null 2>&1; then
            curl -fsSL "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
              | tar -xz -C "$HOME/.local/bin" --strip-components=1 bin/buildctl
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and push
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building ${REGISTRY}/finance/${SERVICE}:${TAG} from ./${SERVICE}"
          buildctl build \
            --progress plain \
            --frontend dockerfile.v0 \
            --local context="./${SERVICE}" \
            --local dockerfile="./${SERVICE}" \
            --opt filename=Dockerfile \
            --output "type=image,name=${REGISTRY}/finance/${SERVICE}:${TAG},push=true"

      - name: Bump image tag in the manifest
        run: |
          set -euo pipefail
          file="k8s/apps/${SERVICE}.yaml"
          sed -i -E "s#(image: ).*finance/${SERVICE}:.*#\1${REGISTRY}/finance/${SERVICE}:${TAG}#" "$file"
          if git diff --quiet -- "$file"; then
            echo "Manifest already points at ${TAG}; nothing to commit."
            exit 0
          fi
          git config user.name "pfa-ci"
          git config user.email "ci@verginjose.local"
          git add "$file"
          git commit -m "ci: ${SERVICE} -> ${TAG} [skip ci]"

          # Serialised by max-parallel, but a second workflow run or a manual
          # push can still move the branch. Rebase and retry instead of
          # failing a build whose image was already pushed successfully.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 2))
          done
          echo "Could not push the tag bump after 5 attempts" >&2
          exit 1

      # Deployment is Argo CD's job: it watches k8s/apps and syncs the new
      # image tag once the tag-bump commit lands. The runner needs no cluster
      # permissions at all.
