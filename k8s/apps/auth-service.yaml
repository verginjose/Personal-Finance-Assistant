apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
# Non-secret configuration for this service only. Credentials live in the
# auth-service-secrets Secret, rendered by k8s/apply.sh from env/auth-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  REDIS_HOST: redis
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: auth-service
          image: 127.0.0.1:30500/finance/auth-service:14803175709d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          # Bulk config and credentials; both are injected before `env` below.
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets
          env:
            # Derived values. $(VAR) resolves against the envFrom variables,
            # which Kubernetes injects before this list.
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres-primary:5432/$(DB_NAME)?schema=$(AUTH_DB_SCHEMA)
            - name: SPRING_R2DBC_USERNAME
              value: $(DB_USER)
            - name: SPRING_R2DBC_PASSWORD
              value: $(DB_PASSWORD)
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
