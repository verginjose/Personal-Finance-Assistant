# The encrypted Secrets, applied by Argo CD. The Sealed Secrets controller
# decrypts each SealedSecret into the real Secret. The controller itself is
# installed once by k8s/apply.sh (bootstrap), so this Application only manages
# the SealedSecret objects.
#
# The Application is named pfa-secrets for historical reasons; the Secret that
# shares that name no longer exists. k8s/sealed/ now holds one scoped Secret per
# workload group (postgres-secrets, redis-secrets, clickhouse-secrets,
# minio-secrets, grafana-secrets, cloudflared-secrets, pfa-ci-secrets) plus one
# per application service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/verginjose/Personal-Finance-Assistant.git
    targetRevision: master
    path: k8s/sealed
  destination:
    server: https://kubernetes.default.svc
    namespace: pfa
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
