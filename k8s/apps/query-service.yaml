apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: query-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: query-service
          image: finance/query-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_PASSWORD }
            - name: FINANCE_DB_SCHEMA
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: FINANCE_DB_SCHEMA }

            # Read side of CQRS: reads from the streaming replica.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-replica:5432/$(DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              value: $(DB_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(DB_PASSWORD)
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
            - name: SPRING_DATASOURCE_HIKARI_SCHEMA
              value: $(FINANCE_DB_SCHEMA)

            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: REDIS_PASSWORD }
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: REDIS_PASSWORD }

            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              value: guest
            - name: SPRING_RABBITMQ_PASSWORD
              value: guest

            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: GROQ_API_KEY }
            - name: GROQ_MODEL
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: GROQ_MODEL }
            - name: GROQ_URL
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: GROQ_URL }

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ZGenerational -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
