apiVersion: v1
kind: Namespace
metadata:
  name: pfa
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
    # Pod Security Admission. Everything here satisfies Baseline. The two
    # workloads that cannot - Vector (hostPath log mounts) and buildkitd
    # (seccomp Unconfined + SELinux spc_t) - live in pfa-system instead.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
