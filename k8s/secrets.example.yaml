# Template only — do NOT commit real values.
#
# There is no shared infrastructure Secret. Each workload group gets its own
# Secret containing only the keys it consumes, so rotating one credential
# restarts only the pods that care about it:
#
#   postgres-secrets     ← postgres-primary, postgres-replica
#   redis-secrets        ← redis, redis-replica
#   clickhouse-secrets   ← clickhouse, vector
#   minio-secrets        ← minio
#   grafana-secrets      ← grafana
#   cloudflared-secrets  ← cloudflared (optional)
#   pfa-ci-secrets       ← the GitHub runner
#   <service>-secrets    ← one per application service, from env/<service>.env
#
# In practice you never write these by hand: `k8s/seal-secrets.sh` reads the
# repo-root `.env` and seals exactly the right keys into `k8s/sealed/`.
#
# This file is documentation. To create them manually instead, split it into
# one file per Secret and `kubectl apply` it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: pfa
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
type: Opaque
stringData:
  DB_NAME: pfa_db
  DB_USER: pfa_admin
  DB_PASSWORD: change-me
  FINANCE_DB_SCHEMA: finance
  AUTH_DB_SCHEMA: auth
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: pfa
type: Opaque
stringData:
  # Empty string = no auth.
  REDIS_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secrets
  namespace: pfa
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: pfa
type: Opaque
stringData:
  MINIO_ROOT_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: pfa
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secrets
  namespace: pfa
type: Opaque
stringData:
  # Only used with k8s/optional/cloudflared.yaml.
  CLOUDFLARE_TUNNEL_TOKEN: change-me
