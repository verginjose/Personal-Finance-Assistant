apiVersion: v1
kind: Service
metadata:
  name: ocr-service
  namespace: pfa
  labels:
    app: ocr-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: ocr-service
  ports:
    - name: http
      port: 8100
      targetPort: 8100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paddle-model-cache
  namespace: pfa
  labels:
    app: ocr-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# Non-secret configuration for this service only. Credentials live in the
# ocr-service-secrets Secret, rendered by k8s/apply.sh from env/ocr-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-service-config
  namespace: pfa
  labels:
    app: ocr-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  FLAGS_fraction_of_gpu_memory_to_use: "0.65"
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  UPSERT_SERVICE_URL: http://command-service:8081
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  OCR_USE_ANGLE_CLS: "false"
  OCR_DET_LIMIT_SIDE_LEN: "736"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: admin
  MINIO_SECURE: "false"
  GROQ_MODEL: openai/gpt-oss-120b
  GROQ_URL: https://api.groq.com/openai/v1/chat/completions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-service
  namespace: pfa
  labels:
    app: ocr-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  # ReadWriteOnce volume + a heavyweight GPU process: never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocr-service
  template:
    metadata:
      labels:
        app: ocr-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 60
      # Remove the GPU request below (and set FLAGS_fraction_of_gpu_memory_to_use=0)
      # if you run this on a cluster/node without an NVIDIA GPU.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ocr-service
          image: 127.0.0.1:30500/finance/ocr-service:8124fa1e87b1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: ocr-service-config
            - secretRef:
                name: ocr-service-secrets
          env:
            # The OCR service reads MINIO_SECRET_KEY; the Secret stores the
            # MinIO root password under its infrastructure-wide name.
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ocr-service-secrets, key: MINIO_ROOT_PASSWORD }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: 1
          # PaddleOCR loads models on first start; give it plenty of runway.
          startupProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: paddle-cache
              mountPath: /root/.paddleocr
      volumes:
        - name: paddle-cache
          persistentVolumeClaim:
            claimName: paddle-model-cache
