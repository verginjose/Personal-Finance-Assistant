apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pfa-root
  namespace: argocd
spec:
  description: Scoped Personal Finance Assistant root
  sourceRepos:
  - https://github.com/verginjose/Personal-Finance-Assistant.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pfa-apps
  namespace: argocd
spec:
  description: Scoped Personal Finance Assistant apps
  sourceRepos:
  - https://github.com/verginjose/Personal-Finance-Assistant.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pfa
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: apps
    kind: DaemonSet
  - group: batch
    kind: Job
  - group: batch
    kind: CronJob
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: networking.k8s.io
    kind: Ingress
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: bitnami.com
    kind: SealedSecret
  - group: ''
    kind: Pod
  - group: apps
    kind: ReplicaSet
---
