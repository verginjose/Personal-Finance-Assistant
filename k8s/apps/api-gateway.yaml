apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pfa
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Non-secret configuration for this service only. Credentials live in the
# api-gateway-secrets Secret, rendered by k8s/apply.sh from env/api-gateway.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: pfa
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: admin
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ZGenerational -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: pfa
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: 127.0.0.1:30500/finance/api-gateway:46fa98316e53
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          env:
            # The gateway reads MINIO_SECRET_KEY; the Secret stores the
            # MinIO root password under its infrastructure-wide name.
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: api-gateway-secrets, key: MINIO_ROOT_PASSWORD }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
