apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: pfa
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  rabbitmq.conf: |
    # The container sees the 1Gi cgroup limit, so the default 0.4 watermark
    # (≈410Mi) is where publishers get flow-controlled. Give the broker more
    # headroom before it raises the memory alarm.
    vm_memory_high_watermark.relative = 0.7
    # Do not let the broker grow to the full limit before reclaiming.
    vm_memory_high_watermark_paging_ratio = 0.5
    # Absolute (not relative) so a mis-detected host memory figure cannot turn
    # this into a permanent disk alarm.
    disk_free_limit.absolute = 2GB
    # The management plugin's periodic metrics collector is deprecated and was
    # logging a multi-line warning on every start. Nothing scrapes the RabbitMQ
    # management API metrics, so opt into the "removed" behaviour explicitly.
    deprecated_features.permit.management_metrics_collection = false
  ensure-service-user.sh: |
    #!/bin/sh
    # Default-user environment variables only initialize an empty database.
    # Reconcile the configured account when starting with an existing PVC too.
    set -eu
    : "${RABBITMQ_DEFAULT_USER:?Missing service username}"
    : "${RABBITMQ_DEFAULT_PASS:?Missing service password}"
    # postStart runs concurrently with the entrypoint. The first CLI call
    # can fail before the Erlang node/pid file exists; retry instead of making
    # kubelet kill an otherwise healthy broker during its first seconds.
    attempts=0
    until rabbitmqctl --timeout 10 await_startup >/dev/null 2>&1; do
      attempts=$((attempts + 1))
      if [ "$attempts" -ge 30 ]; then
        echo 'RabbitMQ did not become available for service-account reconciliation' >&2
        exit 1
      fi
      sleep 2
    done
    if ! rabbitmqctl authenticate_user "$RABBITMQ_DEFAULT_USER" "$RABBITMQ_DEFAULT_PASS" >/dev/null 2>&1; then
      if rabbitmqctl -q list_users | awk -v user="$RABBITMQ_DEFAULT_USER" '$1 == user { found=1 } END { exit !found }'; then
        rabbitmqctl change_password "$RABBITMQ_DEFAULT_USER" "$RABBITMQ_DEFAULT_PASS" >/dev/null
      else
        rabbitmqctl add_user "$RABBITMQ_DEFAULT_USER" "$RABBITMQ_DEFAULT_PASS" >/dev/null
      fi
    fi
    rabbitmqctl set_permissions -p / "$RABBITMQ_DEFAULT_USER" '.*' '.*' '.*' >/dev/null
    rabbitmqctl authenticate_user "$RABBITMQ_DEFAULT_USER" "$RABBITMQ_DEFAULT_PASS" >/dev/null 2>&1
    # One OCR job runs at a time (prefetch=1). Bound waiting work and reject
    # new publishes with publisher NACKs; never silently discard old receipts.
    rabbitmqctl set_policy --apply-to queues pfa-ocr-capacity '^ocr-jobs$' \
      '{"max-length":3,"overflow":"reject-publish"}' >/dev/null
    rabbitmqctl set_policy --apply-to queues pfa-ocr-dead-capacity '^ocr-jobs-dead$' \
      '{"max-length":32,"overflow":"reject-publish"}' >/dev/null
    echo 'Configured RabbitMQ service account is ready'
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: pfa
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: pfa
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "/etc/rabbitmq/ensure-service-user.sh"]
          env:
            # Keep each short-lived CLI VM small under the 500m CPU quota.
            - name: RABBITMQ_CTL_ERL_ARGS
              value: "+S 1:1 +A 2"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: rabbitmq-secrets, key: RABBITMQ_PASSWORD}
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/ensure-service-user.sh
              subPath: ensure-service-user.sh
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 100
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: volume-permissions
          image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
          command:
            - /bin/sh
            - -c
            - "set -eu\nif [ \"$(stat -c %u /var/lib/rabbitmq)\" != \"100\" ]; then
              chown -R 100:101 /var/lib/rabbitmq; fi\nif [ -f /var/lib/rabbitmq/.erlang.cookie
              ]; then chown 100:101 /var/lib/rabbitmq/.erlang.cookie; chmod 600 /var/lib/rabbitmq/.erlang.cookie;
              fi\n"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
