apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pfa-registry-gc-exec
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods/exec
      operations:
      - CONNECT
  matchConditions:
  - name: registry-maintenance-identity
    expression: request.userInfo.username == 'system:serviceaccount:pfa:registry-gc'
  validations:
  - expression: "request.namespace == 'pfa' && has(object.command) &&\n(!has(object.stdin) || !object.stdin) &&\
      \ (!has(object.tty) || !object.tty) && (\n  (request.name.matches('^ci-runner-[a-z0-9]+-[a-z0-9]+$') && object.command\
      \ == ['pgrep','-f','Runner.Worker']) ||\n  (request.name.matches('^registry-[a-z0-9]+-[a-z0-9]+$') && (\n\
      \    object.command == ['registry','garbage-collect','--dry-run','--delete-untagged','/etc/registry/config.yml']\
      \ ||\n    object.command == ['registry','garbage-collect','--delete-untagged','/etc/registry/config.yml']\
      \ ||\n    (size(object.command) == 3 && object.command[0] == 'rm' && object.command[1] == '-rf' &&\n     object.command[2].matches('^/var/lib/registry/docker/registry/v2/repositories/finance/[a-z0-9][a-z0-9._-]*/_manifests/tags/[a-zA-Z0-9][a-zA-Z0-9._-]*$'))\n\
      \  ))\n)"
    message: Registry maintenance may only check runner activity or run the fixed registry garbage-collection/tag-retention
      commands.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pfa-registry-gc-exec
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  policyName: pfa-registry-gc-exec
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pfa-registry-gc-deployment
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      operations:
      - UPDATE
  matchConditions:
  - name: registry-maintenance-identity
    expression: request.userInfo.username == 'system:serviceaccount:pfa:registry-gc'
  validations:
  - expression: request.namespace == 'pfa' && request.name == 'registry'
    message: Registry maintenance can update only the registry Deployment.
  - expression: size(object.spec.template.spec.containers) == 1 && size(oldObject.spec.template.spec.containers)
      == 1
    message: Registry maintenance cannot add containers.
  - expression: (has(object.spec.replicas) == has(oldObject.spec.replicas) && (!has(object.spec.replicas) || object.spec.replicas
      == oldObject.spec.replicas))
    message: Registry maintenance cannot change Deployment replicas.
  - expression: (has(object.spec.selector) == has(oldObject.spec.selector) && (!has(object.spec.selector) || object.spec.selector
      == oldObject.spec.selector))
    message: Registry maintenance cannot change Deployment selector.
  - expression: (has(object.spec.strategy) == has(oldObject.spec.strategy) && (!has(object.spec.strategy) || object.spec.strategy
      == oldObject.spec.strategy))
    message: Registry maintenance cannot change Deployment strategy.
  - expression: (has(object.spec.paused) == has(oldObject.spec.paused) && (!has(object.spec.paused) || object.spec.paused
      == oldObject.spec.paused))
    message: Registry maintenance cannot change Deployment paused.
  - expression: (has(object.spec.minReadySeconds) == has(oldObject.spec.minReadySeconds) && (!has(object.spec.minReadySeconds)
      || object.spec.minReadySeconds == oldObject.spec.minReadySeconds))
    message: Registry maintenance cannot change Deployment minReadySeconds.
  - expression: (has(object.spec.revisionHistoryLimit) == has(oldObject.spec.revisionHistoryLimit) && (!has(object.spec.revisionHistoryLimit)
      || object.spec.revisionHistoryLimit == oldObject.spec.revisionHistoryLimit))
    message: Registry maintenance cannot change Deployment revisionHistoryLimit.
  - expression: (has(object.spec.progressDeadlineSeconds) == has(oldObject.spec.progressDeadlineSeconds) && (!has(object.spec.progressDeadlineSeconds)
      || object.spec.progressDeadlineSeconds == oldObject.spec.progressDeadlineSeconds))
    message: Registry maintenance cannot change Deployment progressDeadlineSeconds.
  - expression: (has(object.spec.template.metadata.labels) == has(oldObject.spec.template.metadata.labels) && (!has(object.spec.template.metadata.labels)
      || object.spec.template.metadata.labels == oldObject.spec.template.metadata.labels))
    message: Registry maintenance cannot change pod labels.
  - expression: (has(object.spec.template.metadata.annotations) == has(oldObject.spec.template.metadata.annotations)
      && (!has(object.spec.template.metadata.annotations) || object.spec.template.metadata.annotations == oldObject.spec.template.metadata.annotations))
    message: Registry maintenance cannot change pod annotations.
  - expression: (has(object.spec.template.spec.serviceAccountName) == has(oldObject.spec.template.spec.serviceAccountName)
      && (!has(object.spec.template.spec.serviceAccountName) || object.spec.template.spec.serviceAccountName ==
      oldObject.spec.template.spec.serviceAccountName))
    message: Registry maintenance cannot change pod serviceAccountName.
  - expression: (has(object.spec.template.spec.serviceAccount) == has(oldObject.spec.template.spec.serviceAccount)
      && (!has(object.spec.template.spec.serviceAccount) || object.spec.template.spec.serviceAccount == oldObject.spec.template.spec.serviceAccount))
    message: Registry maintenance cannot change pod serviceAccount.
  - expression: (has(object.spec.template.spec.automountServiceAccountToken) == has(oldObject.spec.template.spec.automountServiceAccountToken)
      && (!has(object.spec.template.spec.automountServiceAccountToken) || object.spec.template.spec.automountServiceAccountToken
      == oldObject.spec.template.spec.automountServiceAccountToken))
    message: Registry maintenance cannot change pod automountServiceAccountToken.
  - expression: (has(object.spec.template.spec.volumes) == has(oldObject.spec.template.spec.volumes) && (!has(object.spec.template.spec.volumes)
      || object.spec.template.spec.volumes == oldObject.spec.template.spec.volumes))
    message: Registry maintenance cannot change pod volumes.
  - expression: (has(object.spec.template.spec.securityContext) == has(oldObject.spec.template.spec.securityContext)
      && (!has(object.spec.template.spec.securityContext) || object.spec.template.spec.securityContext == oldObject.spec.template.spec.securityContext))
    message: Registry maintenance cannot change pod securityContext.
  - expression: (has(object.spec.template.spec.initContainers) == has(oldObject.spec.template.spec.initContainers)
      && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers == oldObject.spec.template.spec.initContainers))
    message: Registry maintenance cannot change pod initContainers.
  - expression: (has(object.spec.template.spec.hostNetwork) == has(oldObject.spec.template.spec.hostNetwork) &&
      (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == oldObject.spec.template.spec.hostNetwork))
    message: Registry maintenance cannot change pod hostNetwork.
  - expression: (has(object.spec.template.spec.hostPID) == has(oldObject.spec.template.spec.hostPID) && (!has(object.spec.template.spec.hostPID)
      || object.spec.template.spec.hostPID == oldObject.spec.template.spec.hostPID))
    message: Registry maintenance cannot change pod hostPID.
  - expression: (has(object.spec.template.spec.hostIPC) == has(oldObject.spec.template.spec.hostIPC) && (!has(object.spec.template.spec.hostIPC)
      || object.spec.template.spec.hostIPC == oldObject.spec.template.spec.hostIPC))
    message: Registry maintenance cannot change pod hostIPC.
  - expression: (has(object.spec.template.spec.shareProcessNamespace) == has(oldObject.spec.template.spec.shareProcessNamespace)
      && (!has(object.spec.template.spec.shareProcessNamespace) || object.spec.template.spec.shareProcessNamespace
