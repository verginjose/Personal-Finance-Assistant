# Self-hosted GitHub Actions runner.
#
# The runner only orchestrates: builds execute in the buildkitd pod and images
# are pushed straight to the in-cluster registry. It therefore needs no
# privileged container and no docker socket.
#
# Registration uses a PAT (secret pfa-ci-secrets/GITHUB_PAT) so the runner can
# re-register itself; the token is never written to disk by the workflow.
#
# The ServiceAccount may patch Deployments and read Pods — that is for the
# interim `kubectl` deploy step in .github/workflows/build.yml. Remove the
# RoleBinding once Argo CD owns the sync (phase 3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: pfa
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # k8s/apps/<svc>.yaml contains both the Service and the Deployment, so
  # `kubectl apply -f` needs read/write on each.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-runner-deployer
  namespace: pfa
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: pfa
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      serviceAccountName: ci-runner
      containers:
        - name: runner
          image: myoung34/github-runner:2.338.2-ubuntu-jammy
          imagePullPolicy: IfNotPresent
          env:
            - name: REPO_URL
              value: https://github.com/verginjose/Personal-Finance-Assistant
            - name: RUNNER_NAME
              value: pfa-k3s
            - name: RUNNER_SCOPE
              value: repo
            - name: RUNNER_WORKDIR
              value: /tmp/runner/work
            # Labels must match `runs-on:` in .github/workflows/build.yml.
            - name: LABELS
              value: self-hosted,linux,x64,pfa
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pfa-ci-secrets
                  key: GITHUB_PAT
          volumeMounts:
            - name: work
              mountPath: /tmp/runner
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "Runner.Listener"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: work
          emptyDir: {}
