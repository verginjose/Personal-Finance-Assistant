# Build changed services on the in-cluster self-hosted runner, push them to the
# in-cluster registry, and point the Deployment at the new immutable tag.
#
# Replaces the manual `./k8s/build-images.sh` + `docker save | k3s ctr images
# import` flow. See k8s/ci/README.md for the one-time setup.
name: build-and-deploy

on:
  push:
    branches: ["master", "k8s/local-deployment"]
    paths-ignore:
      - "**.md"
      - "k8s/ci/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build, or 'all' to backfill every image"
        required: true
        default: all
        type: choice
        options: [all, auth-service, api-gateway, command-service, query-service, frontend, ocr-service]

# The job pushes the tag bump back to the same repo.
permissions:
  contents: write

# Never run two builds at once: a Maven build and an OCR build together will
# exceed the node's memory, and the tag-bump commits would race.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  # BuildKit runs inside the cluster, so it pushes through the Service DNS name
  # (stable, independent of the node's LAN IP). kubelet/containerd run on the
  # host and pull through the NodePort on loopback, also stable.
  #
  # Both buildkitd and the registry are mTLS-only. The runner pod mounts the
  # ci-tls-client Secret at /certs; the same directory feeds buildctl and
  # registry-gc.sh.
  PUSH_REGISTRY: registry.pfa.svc.cluster.local:5000
  PULL_REGISTRY: 127.0.0.1:30500
  BUILDKIT_HOST: tcp://buildkitd.pfa-system.svc.cluster.local:1234
  BUILDKIT_TLS_DIR: /certs
  BUILDKIT_VERSION: v0.15.2
  ALL_SERVICES: auth-service api-gateway command-service query-service frontend ocr-service

jobs:
  detect:
    runs-on: [self-hosted, linux, x64, pfa]
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine services to build
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          selected=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_SERVICE" == "all" ]]; then
              selected="$ALL_SERVICES"
            else
              selected="$INPUT_SERVICE"
            fi
          else
            # Diff the whole push, not just its tip: a push of several commits
            # would otherwise only build services touched by the last one.
            # New branches report an all-zero BEFORE, so fall back to HEAD^.
            base="$BEFORE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
            changed_files="$(git diff --name-only "$base" "$AFTER")"
            for svc in $ALL_SERVICES; do
              if printf '%s\n' "$changed_files" | grep -q "^${svc}/"; then
                selected="$selected $svc"
              fi
            done
          fi
          selected="$(echo $selected)"   # trim leading space
          json="[]"
          if [[ -n "$selected" ]]; then
            json="[$(printf '%s\n' $selected | sed 's/.*/"&"/' | paste -sd, -)]"
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Selected: $json"

  build:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: [self-hosted, linux, x64, pfa]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch tip, not github.sha. Every matrix job would
          # otherwise branch from the same triggering commit and their
          # tag-bump pushes would conflict with each other.
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # the tag-bump commit is pushed from this checkout

      - name: Install buildctl if missing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /opt/buildctl
          # /opt/buildctl is a hostPath-backed cache (k8s/ci/runner.yaml), so
          # the download happens once per node instead of once per job. The
          # release asset takes ~2.5 minutes to fetch on this link.
          if [ ! -x /opt/buildctl/buildctl ]; then
            tmp="$(mktemp -d)"
            curl -fsSL "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
              | tar -xz -C "$tmp" --strip-components=1 bin/buildctl
            install -m 0755 "$tmp/buildctl" /opt/buildctl/buildctl
            rm -rf "$tmp"
          fi
          ln -sf /opt/buildctl/buildctl "$HOME/.local/bin/buildctl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/buildctl" --version

      - name: Build and push
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building ${PUSH_REGISTRY}/finance/${SERVICE}:${TAG} from ./${SERVICE}"
          # Base images are mirrored into the registry (k8s/ci/mirror-base-images.sh),
          # so a cold BuildKit cache costs a loopback pull instead of Docker Hub.
          buildctl \
            --tlscacert "$BUILDKIT_TLS_DIR/ca.crt" \
            --tlscert "$BUILDKIT_TLS_DIR/client.cert" \
            --tlskey "$BUILDKIT_TLS_DIR/client.key" \
            build \
            --progress plain \
            --frontend dockerfile.v0 \
            --local context="./${SERVICE}" \
            --local dockerfile="./${SERVICE}" \
            --opt filename=Dockerfile \
            --opt build-arg:BASE_IMAGE_REGISTRY="${PUSH_REGISTRY}/base" \
            --output "type=image,name=${PUSH_REGISTRY}/finance/${SERVICE}:${TAG},push=true"

      - name: Reclaim cache for this build
        # The post-build GC runs ~1s after Solve returns, before the build's
        # own leases have all dropped, so it skips the layers this build just
        # pulled and never revisits them. Re-running the prune here - idle by
        # definition - takes the lease-releasing path and reclaims them now
        # instead of leaving ~50 GB for the ocr-service build to sit on until
        # the next buildkit-prune run.
        #
        # Only the categories this build can have created are named. The
        # ocr-base rule is repeated because each call removes at most 10
        # records (maxPruneBatch) and an image pull is 16 layers. Keep in sync
        # with k8s/ci/buildkit-prune-cron.yaml.
        #
        # The rule names /finance/ocr-base specifically: the mirrored base
        # images also live on that registry, and a bare host match would drop
        # them from the cache after every build.
        run: |
          set -euo pipefail
          BCTL=(buildctl --tlscacert "$BUILDKIT_TLS_DIR/ca.crt" \
                         --tlscert "$BUILDKIT_TLS_DIR/client.cert" \
                         --tlskey "$BUILDKIT_TLS_DIR/client.key")
          for _ in 1 2 3; do
            "${BCTL[@]}" prune -f 'description~=registry\.pfa\.svc\.cluster\.local:5000/finance/ocr-base'
          done
          "${BCTL[@]}" prune --keep-storage 61440

      - name: Trim old registry tags
        # Phase 1 of registry-gc.sh only: pure HTTPS API calls, so it needs no
        # cluster credentials, and it leaves the registry running. It bounds
        # how many tags pile up, but frees no disk on its own — the blob sweep
        # needs the registry stopped (./k8s/stop.sh --gc, or the registry-gc
        # CronJob). The registry is mTLS-only; the client certificate paths
        # come from the runner Deployment's environment (/certs).
        run: |
          set -euo pipefail
          REGISTRY="https://${PUSH_REGISTRY}" ./k8s/ci/registry-gc.sh --retention-only --keep=2

      - name: Bump image tag in the manifest
        run: |
          set -euo pipefail
          file="k8s/apps/${SERVICE}.yaml"
          sed -i -E "s#(image: ).*finance/${SERVICE}:.*#\1${PULL_REGISTRY}/finance/${SERVICE}:${TAG}#" "$file"
          if git diff --quiet -- "$file"; then
            echo "Manifest already points at ${TAG}; nothing to commit."
            exit 0
          fi
          git config user.name "pfa-ci"
          git config user.email "ci@verginjose.local"
          git add "$file"
          git commit -m "ci: ${SERVICE} -> ${TAG} [skip ci]"

          # Serialised by max-parallel, but a second workflow run or a manual
          # push can still move the branch. Rebase and retry instead of
          # failing a build whose image was already pushed successfully.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 2))
          done
          echo "Could not push the tag bump after 5 attempts" >&2
          exit 1

      # Deployment is Argo CD's job: it watches k8s/apps and syncs the new
      # image tag once the tag-bump commit lands. The runner needs no cluster
      # permissions at all.
