apiVersion: v1
kind: Service
metadata:
  name: command-service
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: command-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
# Non-secret configuration for this service only. Credentials live in the
# command-service-secrets Secret, rendered by k8s/apply.sh from
# env/command-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: command-service-config
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  # No SPRING_JPA_DATABASE_PLATFORM: Hibernate 6 infers PostgreSQL from the
  # JDBC connection. Setting it explicitly triggers HHH90000025 on every boot.
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_HOST: rabbitmq
  ANALYTICS_SERVICE_URL: http://query-service:8084
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ZGenerational -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-service
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: command-service
  template:
    metadata:
      labels:
        app: command-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Writable /tmp for the JVM (hsperfdata, Tomcat work dir); the rest of
      # the root filesystem is read-only. 65534 is `nobody`, which exists in
      # both the Alpine and the Ubuntu base images, so no passwd entry is
      # missing when the process resolves its own uid.
      securityContext:
        fsGroup: 65534
      containers:
        - name: command-service
          image: 127.0.0.1:30500/finance/command-service:a1b1f3e4ca73
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: command-service-config
            - secretRef:
                name: command-service-secrets
          env:
            # Structured (one-line JSON) stdout for the Vector -> ClickHouse
            # pipeline. Without this profile logback logs a human-readable
            # line, which is what local runs want.
            - name: SPRING_PROFILES_ACTIVE
              value: structured-logs
            # Write side of CQRS: always hits the primary.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-primary:5432/$(DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              value: $(DB_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(DB_PASSWORD)
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
            - name: SPRING_DATASOURCE_HIKARI_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Host has 16 vCPU; 3 keeps the write path responsive under the
              # 50-user scenario while leaving cores for the desktop.
              cpu: "3"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
