        {
          "id": 4,
          "title": "Runbook — psql commands",
          "type": "text",
          "options": {
            "mode": "markdown",
            "code": {
              "language": "bash",
              "showLineNumbers": true
            },
            "content": "## Copy/paste runbook\n\nRun from the repo root. `DB_USER`, `DB_NAME` and `DB_PASSWORD` come from `.env`.\n\n```bash\nexport DB_USER=$(sed -n 's/^DB_USER=//p' .env)\nexport DB_NAME=$(sed -n 's/^DB_NAME=//p' .env)\nexport DB_PW=$(sed -n 's/^DB_PASSWORD=//p' .env)\nexport PRIMARY=postgres-primary-0\nexport REPLICA=$(kubectl -n pfa get pod -l app=postgres-replica -o jsonpath='{.items[0].metadata.name}')\nPSQL=\"kubectl -n pfa exec $PRIMARY -- env PGPASSWORD=$DB_PW psql -U $DB_USER -d $DB_NAME\"\n```\n\n### 1. Is it healthy?\n\n```bash\nkubectl -n pfa exec $PRIMARY -- pg_isready -U \"$DB_USER\"\n$PSQL -c 'select version();'\n$PSQL -c 'select pg_is_in_recovery();'        # false on primary\n$PSQL -c '\\dn'                                # auth, finance, groups, activity\nkubectl -n pfa logs statefulset/postgres-primary --tail=100\n```\n\n### 2. Replication (why reads lag)\n\n```bash\n# primary\n$PSQL -c \"select client_addr, state, sync_state, sent_lsn, replay_lsn, replay_lag from pg_stat_replication;\"\n# replica\nkubectl -n pfa exec $REPLICA -- env PGPASSWORD=$DB_PW psql -U $DB_USER -d $DB_NAME \\\n  -c \"select status, sender_host, received_lsn, replay_lsn, last_msg_receipt_time from pg_stat_wal_receiver;\"\nkubectl -n pfa exec $REPLICA -- env PGPASSWORD=$DB_PW psql -U $DB_USER -d $DB_NAME \\\n  -c \"select now() - pg_last_xact_replay_timestamp() as replay_lag;\"\n```\n\n`replay_lag` above a second means the query-service read model is stale.\nRepeated `could not connect to the primary server` in the replica logs means\nthe primary was down or the Service DNS/port changed.\n\n### 3. Connections and locks\n\n```bash\n$PSQL -c \"select state, count(*) from pg_stat_activity group by 1 order by 2 desc;\"\n$PSQL -c 'show max_connections;'\n$PSQL -c \"select pid, wait_event_type, wait_event, state, now()-query_start as age, left(query,100) from pg_stat_activity where state <> 'idle' order by age desc;\"\n$PSQL -c \"select blocked.pid, blocking.pid as blocking_pid, left(blocked.query,60) as blocked_query, left(blocking.query,60) as blocking_query from pg_stat_activity blocked join pg_stat_activity blocking on blocking.pid = any(pg_blocking_pids(blocked.pid)) where cardinality(pg_blocking_pids(blocked.pid)) > 0;\"\n```\n\nCancel a runaway query with `select pg_cancel_backend(<pid>);`; use\n`pg_terminate_backend(<pid>)` only when cancellation does not take.\n\n### 4. Slow queries\n\n```bash\n$PSQL -c \"select pid, now()-query_start as age, state, left(query,160) from pg_stat_activity where state = 'active' and now()-query_start > interval '30 seconds' order by age desc;\"\n$PSQL -c \"select datname, xact_commit, xact_rollback, blks_read, blks_hit, round(100.0*blks_hit/nullif(blks_hit+blks_read,0),2) as cache_hit_pct from pg_stat_database;\"\n```\n\nA falling cache hit ratio plus rising `blks_read` usually means a missing index\nor a table scan over a table that outgrew memory.\n\n### 5. Storage, bloat and vacuum\n\n```bash\n$PSQL -c \"select datname, pg_size_pretty(pg_database_size(datname)) from pg_database order by pg_database_size(datname) desc;\"\n$PSQL -c \"select schemaname||'.'||relname as table, pg_size_pretty(pg_total_relation_size(relid)) as total from pg_catalog.pg_statio_user_tables order by pg_total_relation_size(relid) desc limit 20;\"\n$PSQL -c \"select relname, n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze from pg_stat_user_tables order by n_dead_tup desc limit 20;\"\n$PSQL -c \"select relname, indexrelname, idx_scan from pg_stat_user_indexes order by idx_scan asc limit 20;\"\nkubectl -n pfa exec $PRIMARY -- df -h /var/lib/postgresql/data\n```\n\nHigh `n_dead_tup` needs a `VACUUM (ANALYZE) <table>;` (never inside a\ntransaction). Low `idx_scan` on an index means it is a write-only liability.\n\n### 6. Outbox and background work\n\n```bash\n$PSQL -c \"select status, count(*), min(created_at), max(created_at) from finance.outbox_events group by 1 order by 2 desc;\"\n$PSQL -c 'select * from pg_stat_bgwriter;'\n```\n\nPending outbox rows that never drain mean the command-service publisher is\ndown or RabbitMQ is unreachable. Rising `checkpoints_req` means WAL pressure.\n\n### 7. Last resort\n\n```bash\nkubectl -n pfa rollout restart statefulset/postgres-primary   # safe: PVC kept\nkubectl -n pfa get pods -o wide                                # confirm both pods\n```\n\nNever delete the PVC. Do not promote the replica without checking\n`START-STOP.md` first.\n"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 22
          },
          "transparent": false
        }
      ],
      "description": "Postgres primary/replica logs, pod pressure, replication health and copy-paste psql commands. Start here when writes, reads or replica freshness look wrong."
    }
