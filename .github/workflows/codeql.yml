# Advanced CodeQL setup. Default setup cannot drop java-kotlin through the REST
# API without also dropping the (API-unlisted) rust analysis, so the languages
# are declared here instead. Rust is analysed with build-mode=none, the only
# mode its extractor offers. Actions are pinned to full commit SHAs because the
# repository's Actions policy rejects moving tags.
name: CodeQL

on:
  push:
    branches: ["master", "k8s/local-deployment"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        if: matrix.language != 'rust'
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: ${{ matrix.language }}
      - name: Initialize CodeQL (Rust)
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
