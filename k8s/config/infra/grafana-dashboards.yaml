          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 4
          }
        },
        {
          "id": 10,
          "title": "Requests per second by status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"$service\",status=~\"2..\"}[5m]))",
              "refId": "A",
              "legendFormat": "2xx",
              "instant": false,
              "range": true
            },
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"$service\",status=~\"4..\"}[5m]))",
              "refId": "B",
              "legendFormat": "4xx",
              "instant": false,
              "range": true
            },
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"$service\",status=~\"5..\"}[5m]))",
              "refId": "C",
              "legendFormat": "5xx",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
