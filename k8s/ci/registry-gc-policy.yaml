    message: Registry maintenance cannot change pod nodeName.
  - expression: (has(object.spec.template.spec.nodeSelector) == has(oldObject.spec.template.spec.nodeSelector) &&
      (!has(object.spec.template.spec.nodeSelector) || object.spec.template.spec.nodeSelector == oldObject.spec.template.spec.nodeSelector))
    message: Registry maintenance cannot change pod nodeSelector.
  - expression: (has(object.spec.template.spec.affinity) == has(oldObject.spec.template.spec.affinity) && (!has(object.spec.template.spec.affinity)
      || object.spec.template.spec.affinity == oldObject.spec.template.spec.affinity))
    message: Registry maintenance cannot change pod affinity.
  - expression: (has(object.spec.template.spec.tolerations) == has(oldObject.spec.template.spec.tolerations) &&
      (!has(object.spec.template.spec.tolerations) || object.spec.template.spec.tolerations == oldObject.spec.template.spec.tolerations))
    message: Registry maintenance cannot change pod tolerations.
  - expression: (has(object.spec.template.spec.dnsPolicy) == has(oldObject.spec.template.spec.dnsPolicy) && (!has(object.spec.template.spec.dnsPolicy)
      || object.spec.template.spec.dnsPolicy == oldObject.spec.template.spec.dnsPolicy))
    message: Registry maintenance cannot change pod dnsPolicy.
  - expression: (has(object.spec.template.spec.dnsConfig) == has(oldObject.spec.template.spec.dnsConfig) && (!has(object.spec.template.spec.dnsConfig)
      || object.spec.template.spec.dnsConfig == oldObject.spec.template.spec.dnsConfig))
    message: Registry maintenance cannot change pod dnsConfig.
  - expression: (has(object.spec.template.spec.hostAliases) == has(oldObject.spec.template.spec.hostAliases) &&
      (!has(object.spec.template.spec.hostAliases) || object.spec.template.spec.hostAliases == oldObject.spec.template.spec.hostAliases))
    message: Registry maintenance cannot change pod hostAliases.
  - expression: (has(object.spec.template.spec.restartPolicy) == has(oldObject.spec.template.spec.restartPolicy)
      && (!has(object.spec.template.spec.restartPolicy) || object.spec.template.spec.restartPolicy == oldObject.spec.template.spec.restartPolicy))
    message: Registry maintenance cannot change pod restartPolicy.
  - expression: (has(object.spec.template.spec.containers[0].name) == has(oldObject.spec.template.spec.containers[0].name)
      && (!has(object.spec.template.spec.containers[0].name) || object.spec.template.spec.containers[0].name ==
      oldObject.spec.template.spec.containers[0].name))
    message: Registry maintenance cannot change container name.
  - expression: (has(object.spec.template.spec.containers[0].image) == has(oldObject.spec.template.spec.containers[0].image)
      && (!has(object.spec.template.spec.containers[0].image) || object.spec.template.spec.containers[0].image ==
      oldObject.spec.template.spec.containers[0].image))
    message: Registry maintenance cannot change container image.
  - expression: (has(object.spec.template.spec.containers[0].imagePullPolicy) == has(oldObject.spec.template.spec.containers[0].imagePullPolicy)
      && (!has(object.spec.template.spec.containers[0].imagePullPolicy) || object.spec.template.spec.containers[0].imagePullPolicy
      == oldObject.spec.template.spec.containers[0].imagePullPolicy))
    message: Registry maintenance cannot change container imagePullPolicy.
  - expression: (has(object.spec.template.spec.containers[0].command) == has(oldObject.spec.template.spec.containers[0].command)
      && (!has(object.spec.template.spec.containers[0].command) || object.spec.template.spec.containers[0].command
      == oldObject.spec.template.spec.containers[0].command))
    message: Registry maintenance cannot change container command.
  - expression: (has(object.spec.template.spec.containers[0].args) == has(oldObject.spec.template.spec.containers[0].args)
      && (!has(object.spec.template.spec.containers[0].args) || object.spec.template.spec.containers[0].args ==
      oldObject.spec.template.spec.containers[0].args))
    message: Registry maintenance cannot change container args.
  - expression: (has(object.spec.template.spec.containers[0].securityContext) == has(oldObject.spec.template.spec.containers[0].securityContext)
      && (!has(object.spec.template.spec.containers[0].securityContext) || object.spec.template.spec.containers[0].securityContext
      == oldObject.spec.template.spec.containers[0].securityContext))
    message: Registry maintenance cannot change container securityContext.
  - expression: (has(object.spec.template.spec.containers[0].volumeMounts) == has(oldObject.spec.template.spec.containers[0].volumeMounts)
      && (!has(object.spec.template.spec.containers[0].volumeMounts) || object.spec.template.spec.containers[0].volumeMounts
      == oldObject.spec.template.spec.containers[0].volumeMounts))
    message: Registry maintenance cannot change container volumeMounts.
  - expression: (has(object.spec.template.spec.containers[0].volumeDevices) == has(oldObject.spec.template.spec.containers[0].volumeDevices)
      && (!has(object.spec.template.spec.containers[0].volumeDevices) || object.spec.template.spec.containers[0].volumeDevices
      == oldObject.spec.template.spec.containers[0].volumeDevices))
    message: Registry maintenance cannot change container volumeDevices.
  - expression: (has(object.spec.template.spec.containers[0].envFrom) == has(oldObject.spec.template.spec.containers[0].envFrom)
