apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: FinanceAssistantDashboards
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: pfa
