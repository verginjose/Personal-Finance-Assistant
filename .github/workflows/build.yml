# Build changed services on the in-cluster self-hosted runner, push them to the
# in-cluster registry, and point the Deployment at the new immutable tag.
#
# Replaces the manual `./k8s/build-images.sh` + `docker save | k3s ctr images
# import` flow. See k8s/ci/README.md for the one-time setup.
name: build-and-deploy

on:
  push:
    branches: ["master", "k8s/local-deployment"]
    paths-ignore:
      - "**.md"
      - "k8s/ci/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build, or 'all' to backfill every image"
        required: true
        default: all
        type: choice
        options: [all, auth-service, api-gateway, command-service, query-service, frontend, ocr-service]

# Pushing the propose-branch only. The workflow never pushes to the deployment
# branch itself, and it cannot open the PR either: GitHub's token can only do
# that if "Allow GitHub Actions to create and approve pull requests" is on,
# which would also let a compromised run approve its own bump. The run summary
# carries a one-click compare link instead.
permissions:
  contents: write

# Never run two builds at once: a Maven build and an OCR build together will
# exceed the node's memory, and the tag-bump commits would race.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  # BuildKit runs inside the cluster, so it pushes through the Service DNS name
  # (stable, independent of the node's LAN IP). kubelet/containerd run on the
  # host and pull through the NodePort on loopback, also stable.
  #
  # Both buildkitd and the registry are mTLS-only. The runner pod mounts the
  # ci-tls-client Secret at /certs; the same directory feeds buildctl and
  # registry-gc.sh.
  PUSH_REGISTRY: registry.pfa.svc.cluster.local:5000
  PULL_REGISTRY: 127.0.0.1:30500
  BUILDKIT_HOST: tcp://buildkitd.pfa-system.svc.cluster.local:1234
  BUILDKIT_TLS_DIR: /certs
  BUILDKIT_VERSION: v0.15.2
  # SHA-256 of buildkit-v0.15.2.linux-amd64.tar.gz, and the GitHub release
  # asset id used as a download fallback. Bump all three together.
  BUILDCTL_SHA256: 59279df5853bef19a03ec15c5c31b772e59d91d079ab0221e1bafa023cf41c35
  BUILDKIT_ASSET_ID: "186162870"
  ALL_SERVICES: auth-service api-gateway command-service query-service frontend ocr-service

jobs:
  detect:
    runs-on: [self-hosted, linux, x64, pfa]
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      # Pinned to a commit SHA, not a moving tag: a compromised upstream tag
      # would otherwise execute with this runner's git and registry credentials.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Determine services to build
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          selected=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_SERVICE" == "all" ]]; then
              selected="$ALL_SERVICES"
            else
              selected="$INPUT_SERVICE"
            fi
          else
            # Diff the whole push, not just its tip: a push of several commits
            # would otherwise only build services touched by the last one.
            # New branches report an all-zero BEFORE, so fall back to HEAD^.
            base="$BEFORE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
            changed_files="$(git diff --name-only "$base" "$AFTER")"
            for svc in $ALL_SERVICES; do
              if printf '%s\n' "$changed_files" | grep -q "^${svc}/"; then
                selected="$selected $svc"
              fi
            done
          fi
          selected="$(echo $selected)"   # trim leading space
          json="[]"
          if [[ -n "$selected" ]]; then
            json="[$(printf '%s\n' $selected | sed 's/.*/"&"/' | paste -sd, -)]"
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Selected: $json"

  build:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: [self-hosted, linux, x64, pfa]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Check out the branch tip, not github.sha. Every matrix job would
          # otherwise branch from the same triggering commit and their
          # tag-bump pushes would conflict with each other.
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # the tag-bump commit is pushed from this checkout

      - name: Install buildctl
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /opt/buildctl
          # /opt/buildctl is a PVC-backed cache (k8s/ci/runner.yaml), so the
          # 77 MB release asset is fetched once per node instead of once per
          # job. The *tarball* is cached, not the extracted binary: job steps
          # can write this volume, so a binary left behind by an earlier build
          # must never be trusted. Verifying the archive on every run and
          # extracting from it makes the binary provably the pinned release.
          archive="/opt/buildctl/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          if ! echo "${BUILDCTL_SHA256}  ${archive}" | sha256sum -c --status -; then
            rm -f "${archive}"
            # github.com/.../releases/download has returned 504 in bursts on
            # this network. The asset API serves the same bytes; the pinned
            # hash makes either source safe to trust.
            curl -fSL --retry 3 --retry-delay 3 \
                "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
                -o "${archive}" ||
              curl -fSL --retry 3 --retry-delay 3 \
                -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/moby/buildkit/releases/assets/${BUILDKIT_ASSET_ID}" \
                -o "${archive}"
          fi
          echo "${BUILDCTL_SHA256}  ${archive}" | sha256sum -c -
          tmp="$(mktemp -d)"
          tar -xzf "${archive}" -C "${tmp}" --strip-components=1 bin/buildctl
          install -m 0755 "${tmp}/buildctl" "$HOME/.local/bin/buildctl"
          rm -rf "${tmp}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/buildctl" --version

      - name: Build and push
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building ${PUSH_REGISTRY}/finance/${SERVICE}:${TAG} from ./${SERVICE}"
          # Base images are mirrored into the registry (k8s/ci/mirror-base-images.sh),
          # so a cold BuildKit cache costs a loopback pull instead of Docker Hub.
          buildctl \
            --tlscacert "$BUILDKIT_TLS_DIR/ca.crt" \
            --tlscert "$BUILDKIT_TLS_DIR/client.cert" \
            --tlskey "$BUILDKIT_TLS_DIR/client.key" \
            build \
            --progress plain \
            --frontend dockerfile.v0 \
            --local context="./${SERVICE}" \
            --local dockerfile="./${SERVICE}" \
            --opt filename=Dockerfile \
            --opt build-arg:BASE_IMAGE_REGISTRY="${PUSH_REGISTRY}/base" \
            --output "type=image,name=${PUSH_REGISTRY}/finance/${SERVICE}:${TAG},push=true"

      - name: Reclaim cache for this build
        # The post-build GC runs ~1s after Solve returns, before the build's
        # own leases have all dropped, so it skips the layers this build just
        # pulled and never revisits them. Re-running the prune here - idle by
        # definition - takes the lease-releasing path and reclaims them now
        # instead of leaving ~50 GB for the ocr-service build to sit on until
        # the next buildkit-prune run.
        #
        # Only the categories this build can have created are named. The
        # ocr-base rule is repeated because each call removes at most 10
        # records (maxPruneBatch) and an image pull is 16 layers. Keep in sync
        # with k8s/ci/buildkit-prune-cron.yaml.
        #
        # The rule names /finance/ocr-base specifically: the mirrored base
        # images also live on that registry, and a bare host match would drop
        # them from the cache after every build.
        run: |
          set -euo pipefail
          BCTL=(buildctl --tlscacert "$BUILDKIT_TLS_DIR/ca.crt" \
                         --tlscert "$BUILDKIT_TLS_DIR/client.cert" \
                         --tlskey "$BUILDKIT_TLS_DIR/client.key")
          for _ in 1 2 3; do
            "${BCTL[@]}" prune -f 'description~=registry\.pfa\.svc\.cluster\.local:5000/finance/ocr-base'
          done
          "${BCTL[@]}" prune --keep-storage 61440

      # Tag retention used to run here. It needs a registry client
      # certificate, which this pod no longer has (by design); the hourly
      # registry-gc CronJob owns retention now.

  # The runner must never write master: anything that can push to master can
  # make Argo deploy. It proposes the tag bump on a branch and opens a PR
  # instead, so a human merge is the only path from "image built" to
  # "deployed". One PR covers every service this run built.
  promote:
    needs: [detect, build]
    if: needs.detect.outputs.services != '[]'
    runs-on: [self-hosted, linux, x64, pfa]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Propose the tag bump
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          BRANCH="ci/tag-bump-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            file="k8s/apps/${svc}.yaml"
            sed -i -E "s#(image: ).*finance/${svc}:.*#\1${PULL_REGISTRY}/finance/${svc}:${TAG}#" "$file"
          done
          git diff --stat

          if git diff --quiet; then
            echo "Manifests already point at ${TAG}; nothing to propose."
            exit 0
          fi

          git config user.name "pfa-ci"
          git config user.email "ci@verginjose.local"
          git checkout -b "$BRANCH"
          git add k8s/apps
          git commit -m "ci: bump images to ${TAG}"
          git push origin "$BRANCH"

          # A human must open and merge this. The link is prefilled with the
          # title and body so it is two clicks: "Create pull request", then
          # "Merge". See the permissions note at the top of this file for why
          # the job does not open it itself.
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${BRANCH}?expand=1"
          {
            echo "## Images built: ${TAG}"
            echo ""
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo ""
            echo "**Open the pull request:** ${url}"
            echo ""
            echo "Merging it makes Argo CD deploy these images."
          } >> "$GITHUB_STEP_SUMMARY"

      # Deployment is Argo CD's job: it watches k8s/apps and syncs the new
      # image tag once the PR is merged. The runner needs no cluster
      # permissions at all.
