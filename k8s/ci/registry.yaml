# In-cluster OCI registry.
#
# k3s containerd does not share the host Docker image store, so CI needs a
# registry both the builder and the kubelet can reach. The Service is a
# NodePort on purpose: containerd runs on the host, outside the pod network,
# and cannot resolve ClusterIP/DNS names. kubelet pulls from the NodePort on
# loopback (127.0.0.1:30500, see /etc/rancher/k3s/registries.yaml), while
# BuildKit pushes through the ClusterIP DNS name (registry.pfa.svc:5000).
#
# Transport is mutually authenticated TLS: every client must present a
# certificate signed by the CI CA (key `ci-tls-registry`, produced by
# ./k8s/ci/gen-tls-certs.sh). `clientcas` is set without `clientauth`, so
# distribution's default applies - require-and-verify-client-cert. That means
# the readiness/liveness probes cannot be HTTP: kubelet probes present no
# client certificate, so they use a TCP connect instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: pfa
  labels:
    app: registry
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  config.yml: |
    version: 0.1
    http:
      addr: :5000
      tls:
        certificate: /tls/tls.crt
        key: /tls/tls.key
        # Phase 1 of the credential split: both the old CI CA and the new
        # registry-client CA are trusted, so existing clients keep working.
        # Phase 2 removes /tls/ca.crt once host containerd and every pod use
        # the registry-client certificate; only then is the runner's buildkit
        # certificate rejected here.
        clientcas:
          - /tls/ca.crt
          - /tls/client-ca.crt
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true      # required by registry-gc.sh
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: pfa
  labels:
    app: registry
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: pfa
  labels:
    app: registry
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate          # RWO volume: never two pods at once
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        # distribution reads config.yml once at start; without this a
        # ConfigMap edit (e.g. the trusted client CAs) is not picked up.
        configmap.reloader.stakater.com/reload: "registry-config"
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          # The image entrypoint turns a *.yml argument into
          # `registry serve <file>`; the mounted ConfigMap replaces the default
          # config. garbage-collect (CronJob and registry-gc.sh) reads the same
          # file. Do not use subPath: a config edit should roll a new pod.
          args: ["/etc/registry/config.yml"]
          ports:
            - name: https
              containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/registry
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
          # TCP only: an HTTP probe would be rejected without a client cert.
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: registry-config
        - name: tls
          secret:
            secretName: ci-tls-registry
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: pfa
  labels:
    app: registry
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: https
      port: 5000
      targetPort: 5000
      nodePort: 30500
