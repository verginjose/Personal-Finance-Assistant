apiVersion: 1

# Read-only Postgres datasource used by the "Data — Postgres & Redis"
# dashboard. It points at the PRIMARY on purpose: PostgreSQL's statistics
# collector is per-instance and is not replicated, so on the standby
# pg_stat_user_tables.n_live_tup is 0 and cache/scan figures are meaningless.
# Every panel is a SELECT on lightweight catalog/statistics views.
#
# Credentials come from the Grafana Deployment's environment, which is fed
# from the postgres-secrets Secret (see k8s/infrastructure/grafana.yaml).
# $__env{} is resolved by Grafana at provisioning time, so no password is
# stored in this file.
datasources:
  - name: Postgres
    type: postgres
    uid: postgres-ds
    access: proxy
    editable: true
    url: postgres-primary:5432
    database: $__env{POSTGRES_DS_DB}
    user: $__env{POSTGRES_DS_USER}
    jsonData:
      sslmode: disable
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: $__env{POSTGRES_DS_PASSWORD}
