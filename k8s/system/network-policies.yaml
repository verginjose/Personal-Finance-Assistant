# NetworkPolicies for pfa-system (vector + buildkitd).
#
# Cross-namespace counterparts live in k8s/ci/network-policies.yaml and
# k8s/infrastructure: a policy only applies in the namespace it is created in,
# so each side of a cross-namespace connection names the other with a
# namespaceSelector.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd
  namespace: pfa-system
spec:
  podSelector:
    matchLabels: { app: buildkitd }
  policyTypes: [Ingress, Egress]
  ingress:
    # Build submissions and prunes arrive from pfa (runner and the prune job).
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pfa }
          podSelector:
            matchLabels: { app: ci-runner }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pfa }
          podSelector:
            matchLabels: { app: buildkit-prune }
      ports:
        - { protocol: TCP, port: 1234 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Registry access goes through the push proxy in pfa, which holds the
    # client certificate and enforces method/path. buildkitd has no registry
    # credential and no direct route to registry:5000 any more.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pfa }
          podSelector:
            matchLabels: { app: registry-proxy }
      ports:
        - { protocol: TCP, port: 5001 }
    # Maven dependencies. A pull-through cache in pfa; the daemon itself has
    # no route to the internet, so nothing a build step produces can be sent
    # anywhere else.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pfa }
          podSelector:
            matchLabels: { app: maven }
      ports:
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vector
  namespace: pfa-system
spec:
  podSelector:
    matchLabels: { app: vector }
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scrapes the error counters on :9090 from pfa.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pfa }
          podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # ClickHouse ingestion (HTTP interface).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pfa }
          podSelector:
            matchLabels: { app: clickhouse }
      ports:
        - { protocol: TCP, port: 8123 }
    # The kubernetes_logs source annotates events with pod/node metadata.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock:
            cidr: 10.99.99.1/32
      ports:
        - { protocol: TCP, port: 6443 }
