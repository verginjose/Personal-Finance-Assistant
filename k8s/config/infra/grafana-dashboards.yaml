            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-ds"
              },
              "expr": "sum((container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}) and on(pod) (max by (pod) (container_last_seen{namespace=~\"$namespace\"} @ end()) > scalar(max(timestamp(container_last_seen{namespace=~\"$namespace\"} @ end()))) - 120))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Restarts (1h)",
          "description": "Container restarts in the last hour. Above 0 deserves a `kubectl describe`.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "id": 3,
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
