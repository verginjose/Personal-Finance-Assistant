# Hourly garbage collection for the in-cluster registry.
#
# `registry garbage-collect` frees the blobs behind tags that phase 1 of
# registry-gc.sh deleted. It is a mark-and-sweep: it marks the blobs reachable
# from every manifest, then deletes the rest. If a push lands between the mark
# and the sweep, its blobs look unreferenced and get deleted, corrupting the
# image - the filesystem driver takes no lock between the registry and the GC
# process.
#
# Stopping the registry would close that hole but also break pulls, so this job
# uses the read-only variant instead: the Deployment gets
# REGISTRY_STORAGE_MAINTENANCE_READONLY=true, which makes the registry refuse
# writes (503 on push) while continuing to serve pulls, deploys and readiness
# probes. GC then runs inside that pod against the same store. Cost is one
# Recreate rollout each way, and builds that try to push in that window fail.
#
# Argo CD manages the registry Deployment with selfHeal, so it would revert the
# read-only env mid-sweep. The job disables automated sync for the duration and
# restores the exact policy from a trap.
#
# The dry run at the top means most hours do nothing: if no tag was deleted
# since the last sweep there is no garbage, so the registry is never touched.
#
# Tag retention runs before that gate, using the same k8s/ci/registry-gc.sh the
# CI build calls (published as a ConfigMap by kustomization.yaml). The runner
# has no cluster credentials, so over HTTP it can only skip a tag that shares
# its manifest with a kept tag. Here kubectl is available, so it drops the tag
# link from the registry's storage and the now-untagged manifest is collected
# by the sweep in the same run.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-gc
  namespace: pfa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-gc
  namespace: pfa
rules:
  # Scoped to the two Deployments this job touches. RBAC cannot restrict list
  # or watch by resourceName, so the script polls status with `kubectl get`
  # instead of `kubectl rollout status`.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["registry", "ci-runner"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["registry"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # `create` on pods/exec cannot be restricted to a named pod; the namespace is
  # the boundary. Everything else above is as narrow as RBAC allows.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-gc
  namespace: pfa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-gc
subjects:
  - kind: ServiceAccount
    name: registry-gc
    namespace: pfa
---
# Cross-namespace: the job has to stop Argo from reverting the read-only patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-gc-argocd
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["pfa-ci"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-gc-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-gc-argocd
subjects:
  - kind: ServiceAccount
    name: registry-gc
    namespace: pfa
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-gc
  namespace: pfa
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  # Offset off the hour so it does not collide with tag-bump commits landing.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      # Delete the Job and its pod once it finishes. A sweep that does nothing
      # still leaves a completed Job behind; without this they accumulate.
      # Ten minutes leaves time to read the log of a sweep that changed things.
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: registry-gc
        spec:
          serviceAccountName: registry-gc
          restartPolicy: Never
          containers:
            - name: gc
              # Pinned to the cluster's minor version; `registry` is not needed
              # here because garbage-collect runs inside the registry pod.
              image: alpine/k8s:1.36.5
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  NS=pfa
                  APP=pfa-ci
                  DEPLOY=registry
                  CONFIG=/etc/registry/config.yml
                  READONLY=REGISTRY_STORAGE_MAINTENANCE_READONLY

                  log() { echo "==> $*"; }

                  # Same startup race as buildkit-prune: kube-router programs
                  # the new pod's policy a moment after start, so the first
                  # apiserver call can be refused.
                  i=0
                  until kubectl -n "$NS" get deploy "$DEPLOY" >/dev/null 2>&1; do
                    i=$((i+1))
                    if [ "$i" -ge 20 ]; then log "apiserver unreachable"; exit 1; fi
                    sleep 1
                  done

                  # kubectl rollout status watches the Deployment, and the
                  # Role cannot scope watch by resourceName. Poll with get.
                  wait_rollout() {
                    deadline=$(( $(date +%s) + ${1:-180} ))
                    while [ "$(date +%s)" -lt "$deadline" ]; do
                      want="$(kubectl -n "$NS" get deploy "$DEPLOY" -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
                      ready="$(kubectl -n "$NS" get deploy "$DEPLOY" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)"
                      if [ -n "$want" ] && [ -n "$ready" ] && [ "$ready" = "$want" ]; then
                        return 0
                      fi
                      sleep 2
                    done
                    return 1
                  }

                  writable() {
                    kubectl -n "$NS" set env "deploy/$DEPLOY" "$READONLY-" >/dev/null 2>&1 || true
                    wait_rollout 180 >/dev/null 2>&1 || true
                  }

                  restore_sync() {
                    if [ -n "${SYNCPOLICY:-}" ]; then
                      kubectl -n argocd patch app "$APP" --type merge \
                        -p "{\"spec\":{\"syncPolicy\":$SYNCPOLICY}}" >/dev/null 2>&1 || true
                    fi
                  }

                  # Whatever happens, never leave the registry read-only or Argo
                  # with its automated sync disabled.
                  cleanup() { writable; restore_sync; }
                  trap cleanup EXIT

                  # A push landing while the registry is read-only gets a 405 and
                  # fails the build, wasting it. The runner spawns one
                  # Runner.Worker per job, so its absence means no build can be
                  # pushing; defer to the next tick rather than gamble.
                  if kubectl -n "$NS" exec deploy/ci-runner -- \
                       pgrep -f Runner.Worker >/dev/null 2>&1; then
                    log "a CI job is running; deferring the sweep"
                    exit 0
                  fi

                  # Retention first, so the dry-run gate below sees the manifests
                  # it untags. Phase 1 only: this job owns the sweep. Keep 2 in
                  # step with build.yml's `registry-gc.sh --keep=2`.
                  log "trimming tags to 2 per repository"
                  bash /scripts/registry-gc.sh --retention-only --keep=2

                  # Safe against a live registry: it only reads the store.
                  # Anchor the match: the summary line ("N blobs and M
                  # manifests eligible for deletion") contains the same phrase
                  # and would keep the gate open on an idle registry.
                  pending="$(kubectl -n "$NS" exec "deploy/$DEPLOY" -- \
                    registry garbage-collect --dry-run --delete-untagged "$CONFIG" 2>/dev/null \
                    | grep -Ec '^(blob|manifest) eligible for deletion' || true)"
                  if [ "${pending:-0}" -eq 0 ]; then
                    log "nothing to collect; registry left untouched"
                    exit 0
                  fi
                  log "$pending blobs eligible; collecting"

                  SYNCPOLICY="$(kubectl -n argocd get app "$APP" \
                    -o jsonpath='{.spec.syncPolicy}' 2>/dev/null || true)"
                  if [ -n "$SYNCPOLICY" ]; then
                    log "suspending automated sync for $APP"
                    kubectl -n argocd patch app "$APP" --type merge -p '{"spec":{"syncPolicy":null}}'
                  fi

                  # The value must be the whole map as YAML, not a per-key env
                  # var: the env parser builds map[string]interface{} for nested
                  # keys, while handlers.NewApp asserts map[interface{}]interface{}
                  # and panics ("readonly config key must contain additional
                  # keys"). `{enabled: true}` round-trips through yaml.v2 as the
                  # type it expects. Verified: GET /v2/ 200, writes 405.
                  log "switching the registry to read-only"
                  kubectl -n "$NS" set env "deploy/$DEPLOY" "$READONLY={enabled: true}"
                  wait_rollout 180 || { log "registry did not become ready"; exit 1; }

                  log "running garbage-collect"
                  kubectl -n "$NS" exec "deploy/$DEPLOY" -- \
                    registry garbage-collect --delete-untagged "$CONFIG"

                  log "restoring write access"
                  writable
                  log "done"
              env:
                # The script defaults to the node's NodePort on loopback, which
                # does not exist in the pod network. The registry is mTLS-only,
                # so the client certificate is mounted at /certs.
                - name: REGISTRY
                  value: https://registry.pfa.svc.cluster.local:5000
                - name: REGISTRY_CA
                  value: /certs/ca.crt
                - name: REGISTRY_CERT
                  value: /certs/client.cert
                - name: REGISTRY_KEY
                  value: /certs/client.key
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tls
                  mountPath: /certs
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: registry-gc-script
                defaultMode: 0555
            - name: tls
              secret:
                secretName: ci-tls-client
                defaultMode: 0440
