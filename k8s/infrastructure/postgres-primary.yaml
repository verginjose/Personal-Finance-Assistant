apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: pfa
  labels:
    app: postgres-primary
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: postgres-primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: pfa
  labels:
    app: postgres-primary
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        # Restart only for the credentials this workload reads, not for every
        # Secret in the namespace.
        secret.reloader.stakater.com/reload: "postgres-secrets"
        configmap.reloader.stakater.com/reload: "postgres-init"
    spec:
      containers:
        - name: postgres
          image: ankane/pgvector:v0.5.1
          imagePullPolicy: IfNotPresent
          # Each WAL flush on this host costs ~4.6 ms (LUKS + consumer NVMe),
          # so the default commit path measured 9 ms / 110 tps. Turning
          # synchronous_commit off lets COMMIT return once the WAL record is in
          # the page cache; the WAL writer flushes within ~200-600 ms.
          #
          # Tradeoff: a power cut or kernel panic can lose the last few hundred
          # ms of *committed* transactions. It cannot corrupt anything, and it
          # does not apply to process crashes, OOM kills or pod restarts -- the
          # page cache survives those. Revert to "on" if that window matters.
          args: ["-c", "synchronous_commit=off"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: DB_NAME }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            # One core was the bottleneck behind the gateway's 3s slow-call
            # tail and the upsert-cb trips at ~10 concurrent writers. The host
            # has 16 vCPU; give the write path room to queue in Postgres rather
            # than in the gateway.
            limits:
              cpu: "4"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: initdb
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
