# Stakater Reloader v1.4.23
#
# Vendor of:
#   https://github.com/stakater/Reloader/tree/v1.4.23/deployments/kubernetes/manifests
#
# Only change from upstream: moved from the `default` namespace to `reloader`
# (a Namespace is added below) and the resource requests/limits are sized for
# this single-node homelab instead of the Helm chart defaults.
#
# Reloader restarts a workload when a Secret or ConfigMap it references changes.
# Opt in per workload with the annotation on the pod template:
#   reloader.stakater.com/auto: "true"
# That covers every referenced Secret/ConfigMap; use
#   secret.reloader.stakater.com/reload: "<name>"
# to watch one specific Secret instead.
apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader-reloader
  namespace: reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reloader-reloader-role
rules:
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
    verbs:
      - list
      - get
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - list
      - get
      - update
      - patch
  - apiGroups: ["extensions"]
    resources:
      - deployments
      - daemonsets
    verbs:
      - list
      - get
      - update
      - patch
  - apiGroups: ["batch"]
    resources:
      - cronjobs
    verbs:
      - list
      - get
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - create
      - delete
      - list
      - get
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reloader-reloader-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reloader-reloader-role
subjects:
  - kind: ServiceAccount
    name: reloader-reloader
    namespace: reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reloader-reloader-metadata-role
  namespace: reloader
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - list
      - get
      - watch
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reloader-reloader-metadata-rolebinding
  namespace: reloader
subjects:
  - kind: ServiceAccount
    name: reloader-reloader
    namespace: reloader
roleRef:
  kind: Role
  name: reloader-reloader-metadata-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-reloader
  namespace: reloader
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: reloader-reloader
  template:
    metadata:
      labels:
        app: reloader-reloader
    spec:
      containers:
        - image: "ghcr.io/stakater/reloader:v1.4.23"
          imagePullPolicy: IfNotPresent
          name: reloader-reloader
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: '1'
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: '1'
            - name: RELOADER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELOADER_DEPLOYMENT_NAME
              value: reloader-reloader
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /live
              port: http
            timeoutSeconds: 5
            failureThreshold: 5
            periodSeconds: 10
            successThreshold: 1
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            timeoutSeconds: 5
            failureThreshold: 5
            periodSeconds: 10
            successThreshold: 1
            initialDelaySeconds: 10
          securityContext: {}
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: reloader-reloader
