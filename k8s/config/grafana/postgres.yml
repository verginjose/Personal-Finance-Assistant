apiVersion: 1

# Read-only Postgres datasource used by the "Data — Postgres & Redis"
# dashboard. It points at the replica on purpose: every panel in that
# dashboard is a SELECT, and reads should not compete with writes.
#
# Credentials come from the Grafana Deployment's environment, which is fed
# from the postgres-secrets Secret (see k8s/infrastructure/grafana.yaml).
# $__env{} is resolved by Grafana at provisioning time, so no password is
# stored in this file.
datasources:
  - name: Postgres
    type: postgres
    uid: postgres-ds
    access: proxy
    editable: true
    url: postgres-replica:5432
    database: $__env{POSTGRES_DS_DB}
    user: $__env{POSTGRES_DS_USER}
    jsonData:
      sslmode: disable
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $__env{POSTGRES_DS_PASSWORD}
