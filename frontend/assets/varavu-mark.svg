<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Varavu">
  <title>Varavu</title>
  <!-- Paper: the tile sits on both light and dark surfaces without inverting. -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#F2F3EE" stroke="#1D2B32" stroke-opacity="0.12"/>
  <!-- Ledger rules, quiet behind the stroke. -->
  <g stroke="#1D2B32" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round">
    <path d="M15 25h34"/>
    <path d="M15 34h34"/>
    <path d="M15 43h34"/>
  </g>
  <!-- The credit stroke: a pen-drawn V crossing the ledger. -->
  <path d="M19 16l13 25 13-25" fill="none" stroke="#2B4CC9"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
