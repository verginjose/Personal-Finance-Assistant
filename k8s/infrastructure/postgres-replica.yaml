apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: pfa
  labels:
    app: postgres-replica
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: postgres-replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: pfa
  labels:
    app: postgres-replica
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  serviceName: postgres-replica
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        secret.reloader.stakater.com/reload: "postgres-replica-secrets,postgres-tls"
        configmap.reloader.stakater.com/reload: postgres-security
    spec:
      # pg_basebackup only runs on first boot: the PVC is seeded once, then the
      # main container starts streaming replication using the -R recovery config.
      initContainers:
        - name: basebackup
          image: pgvector/pgvector:pg15-bookworm@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-replica-secrets, key: DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-replica-secrets, key: DB_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/postgres-tls/ca.crt
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -s "$PGDATA/PG_VERSION" ]; then
                echo "Replica data directory already initialized, skipping base backup."
                exit 0
              fi
              until pg_isready -h postgres-primary -p 5432 -U "$POSTGRES_USER" >/dev/null 2>&1; do
                echo "Waiting for postgres-primary..."
                sleep 2
              done
              pg_basebackup \
                -d "host=postgres-primary port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}" \
                -D "$PGDATA" -Fp -Xs -P -R
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: postgres-security
              mountPath: /etc/postgres-security
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15-bookworm@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
          imagePullPolicy: IfNotPresent
          # max_connections must be >= the primary's or the standby refuses to
          # accept connections; shared_buffers stays at 1 GiB to match.
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=1GB"
            - "-c"
            - "effective_cache_size=2GB"
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/postgres-security/pg_hba.conf
            - -c
            - ident_file=/etc/postgres-security/pg_ident.conf
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-replica-secrets, key: DB_NAME}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-replica-secrets, key: DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-replica-secrets, key: DB_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/postgres-tls/ca.crt
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: postgres-security
              mountPath: /etc/postgres-security
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 3Gi
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U pfa_admin -d \"$POSTGRES_DB\""
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U pfa_admin -d \"$POSTGRES_DB\""
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: socket
          emptyDir: {}
        - name: postgres-tls
          secret:
            secretName: postgres-tls
            defaultMode: 288
        - name: postgres-security
          configMap:
            name: postgres-security
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
