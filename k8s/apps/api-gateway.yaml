apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pfa
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: pfa
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: finance/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_PASSWORD }
            - name: AUTH_DB_SCHEMA
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: AUTH_DB_SCHEMA }

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: JWT_SECRET }
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: JWT_EXPIRATION }

            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: REDIS_PASSWORD }

            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: guest
            - name: RABBITMQ_PASSWORD
              value: guest

            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres-primary:5432/$(DB_NAME)?schema=$(AUTH_DB_SCHEMA)
            - name: SPRING_R2DBC_USERNAME
              value: $(DB_USER)
            - name: SPRING_R2DBC_PASSWORD
              value: $(DB_PASSWORD)

            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              value: admin
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: MINIO_ROOT_PASSWORD }

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ZGenerational -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
