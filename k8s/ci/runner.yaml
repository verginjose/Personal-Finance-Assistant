# Self-hosted GitHub Actions runner.
#
# The runner only orchestrates: builds execute in the buildkitd pod and images
# are pushed straight to the in-cluster registry. It therefore needs no
# privileged container and no docker socket.
#
# Registration uses a PAT (secret pfa-ci-secrets/GITHUB_PAT) so the runner can
# re-register itself; the token is never written to disk by the workflow.
#
# The runner has no cluster permissions: it builds and pushes, then commits
# the new tag. Argo CD (argocd/) applies that change to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
---
# buildctl cache. Was a hostPath (/var/lib/pfa-ci/buildctl), which gave the
# runner a write primitive on the host. A PVC keeps the "download once" saving
# without exposing the host filesystem.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-buildctl
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      serviceAccountName: ci-runner
      # The runner deliberately holds no RBAC: it builds, pushes and commits.
      # There is no kubectl in the workflow, so it never needs a token.
      automountServiceAccountToken: false
      # fsGroup is the runner account's GID: the ci-tls-client Secret is mode
      # 0440, so without it the certs are root-readable only and job steps
      # running as `runner` cannot call buildkitd.
      securityContext:
        fsGroup: 121
      containers:
        - name: runner
          image: myoung34/github-runner:2.338.2-ubuntu-jammy
          imagePullPolicy: IfNotPresent
          # The entrypoint still starts as root (it registers the runner and
          # then drops privileges); RUN_AS_ROOT=false makes it hand the
          # Runner.Listener and every job step to UID 1001. That matters
          # because jobs used to be root and could read the PAT from
          # /proc/1/environ and the client key from /certs.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          env:
            # Jobs run as `runner`, so HOME must point at a directory that
            # user owns; the image's default is /root.
            - name: HOME
              value: /home/runner
            - name: RUN_AS_ROOT
              value: "false"
            - name: REPO_URL
              value: https://github.com/verginjose/Personal-Finance-Assistant
            - name: RUNNER_NAME
              value: pfa-k3s
            - name: RUNNER_SCOPE
              value: repo
            - name: RUNNER_WORKDIR
              value: /tmp/runner/work
            # Labels must match `runs-on:` in .github/workflows/build.yml.
            - name: LABELS
              value: self-hosted,linux,x64,pfa
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pfa-ci-secrets
                  key: GITHUB_PAT
            # Client certificate for buildkitd and for the registry API calls
            # build.yml makes from this pod (registry-gc.sh). The same files
            # are mounted at /certs; these paths are what the scripts default
            # to when they are given no explicit flags.
            - name: REGISTRY_CA
              value: /certs/ca.crt
            - name: REGISTRY_CERT
              value: /certs/client.cert
            - name: REGISTRY_KEY
              value: /certs/client.key
          volumeMounts:
            - name: work
              mountPath: /tmp/runner
            # buildctl is downloaded once per node, not once per job: the
            # GitHub release download takes ~2.5 minutes on this link and used
            # to dominate every OCR build.
            - name: buildctl
              mountPath: /opt/buildctl
            # mTLS material shared by buildctl (buildkitd) and curl
            # (registry-gc.sh). skopeo-style naming (client.cert/client.key)
            # so the same directory also works for mirror-base-images.sh.
            - name: ci-tls
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "Runner.Listener"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: work
          emptyDir: {}
        - name: buildctl
          persistentVolumeClaim:
            claimName: ci-buildctl
        - name: ci-tls
          secret:
            secretName: ci-tls-client
            defaultMode: 0440
