apiVersion: v1
data:
  data-explorer.json: |
    {
      "uid": "data-explorer",
      "title": "Data — Postgres & Redis",
      "tags": [
        "finance-assistant",
        "postgres",
        "redis",
        "data"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "15s",
          "30s",
          "1m",
          "5m"
        ],
        "time_options": [
          "5m",
          "15m",
          "1h",
          "3h",
          "6h",
          "12h",
          "24h"
        ]
      },
      "templating": {
        "list": []
      },
      "description": "Live metadata for the data layer: Postgres table row counts and sizes, outbox backlog, indexes, settings, active sessions; Redis keys, memory, clients and per-prefix key counts. All panels are current-state reads (no history), so time range only affects the activity table.",
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Postgres — capacity & health",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Database size",
          "type": "stat",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Total on-disk size of the finance_assistant database.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT pg_database_size(current_database()) AS value"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 5
          }
        },
        {
          "id": 2,
          "title": "Connections",
          "type": "stat",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Backends currently connected (Used) out of max_connections (Max).",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*) AS \"Used\", current_setting('max_connections')::int AS \"Max\" FROM pg_stat_activity"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "textMode": "value",
            "colorMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 5
          }
        },
        {
          "id": 3,
          "title": "Cache hit ratio",
          "type": "stat",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Shared-buffer hit ratio for this database. Below ~99% means the working set no longer fits.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COALESCE(round(100.0 * blks_hit / NULLIF(blks_hit + blks_read, 0), 1), 100) AS value FROM pg_stat_database WHERE datname = current_database()"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "textMode": "value",
            "colorMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 5
          }
        },
        {
          "id": 4,
          "title": "Replica lag",
          "type": "stat",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Largest replay lag across connected standbys, in seconds. Zero means caught up.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COALESCE(round(max(extract(epoch FROM replay_lag))), 0) AS value FROM pg_stat_replication"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "textMode": "value",
            "colorMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 5
          }
        },
        {
          "id": 5,
          "title": "Uptime",
          "type": "stat",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Time since the primary last started.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT extract(epoch FROM now() - pg_postmaster_start_time()) AS value"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "textMode": "value",
            "colorMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 5
          }
        },
        {
          "id": 6,
          "title": "Deadlocks",
          "type": "stat",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Cumulative deadlocks since the primary started.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT deadlocks AS value FROM pg_stat_database WHERE datname = current_database()"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "textMode": "value",
            "colorMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 5
          }
        },
        {
          "id": 101,
          "type": "row",
          "title": "Postgres — tables & activity",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 7,
          "title": "Tables — rows, size, scans",
          "type": "table",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Every user table with live/dead tuple counts, total and index size, scan counts and last vacuum.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT schemaname AS \"Schema\",\n       relname AS \"Table\",\n       n_live_tup AS \"Rows\",\n       n_dead_tup AS \"Dead\",\n       pg_total_relation_size(relid) AS \"Size\",\n       pg_indexes_size(relid) AS \"Indexes\",\n       seq_scan AS \"Seq scans\",\n       idx_scan AS \"Idx scans\",\n       to_char(last_vacuum, 'MM-DD HH24:MI') AS \"Last vacuum\"\nFROM pg_stat_user_tables\nORDER BY pg_total_relation_size(relid) DESC"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Size"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Indexes"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Rows"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Dead"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1000
                        },
                        {
                          "color": "red",
                          "value": 10000
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Seq scans"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Idx scans"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Size",
                "desc": true
              }
            ],
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 24,
            "h": 11
          }
        },
        {
          "id": 8,
          "title": "Outbox backlog",
          "type": "table",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Outbox events by status. A growing PENDING count means the publisher is behind.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT status AS \"Status\",\n       count(*) AS \"Events\",\n       to_char(min(created_at), 'MM-DD HH24:MI') AS \"Oldest\",\n       to_char(max(created_at), 'MM-DD HH24:MI') AS \"Newest\"\nFROM finance.outbox_events\nGROUP BY status\nORDER BY count(*) DESC"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Events"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Events",
                "desc": true
              }
            ],
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 9,
          "title": "Active sessions",
          "type": "table",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Non-idle backends, longest first. Look here for idle-in-transaction and lock waits.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT pid AS \"PID\",\n       usename AS \"User\",\n       state AS \"State\",\n       wait_event_type AS \"Wait type\",\n       wait_event AS \"Wait\",\n       round(extract(epoch FROM now() - state_change)) AS \"Seconds\",\n       left(query, 90) AS \"Query\"\nFROM pg_stat_activity\nWHERE pid <> pg_backend_pid() AND state <> 'idle'\nORDER BY \"Seconds\" DESC NULLS LAST\nLIMIT 25"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Seconds"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Seconds",
                "desc": true
              }
            ],
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          },
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 102,
          "type": "row",
          "title": "Postgres — indexes & settings",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 10,
          "title": "Unused indexes",
          "type": "table",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "Indexes with zero scans since the last statistics reset, largest first. Candidates for removal.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT schemaname AS \"Schema\",\n       relname AS \"Table\",\n       indexrelname AS \"Index\",\n       idx_scan AS \"Scans\",\n       pg_relation_size(indexrelid) AS \"Size\"\nFROM pg_stat_user_indexes\nWHERE idx_scan = 0\nORDER BY pg_relation_size(indexrelid) DESC\nLIMIT 20"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Size"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Size",
                "desc": true
              }
            ],
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          },
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 12,
            "h": 9
          }
        },
        {
          "id": 11,
          "title": "Settings",
          "type": "table",
          "datasource": {
            "type": "postgres",
            "uid": "postgres-ds"
          },
          "description": "The settings that explain most performance behaviour. server_version and shared_buffers are the first to check.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "postgres-ds"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT name AS \"Setting\", setting AS \"Value\", unit AS \"Unit\", short_desc AS \"Description\"\nFROM pg_settings\nWHERE name IN (\n    'server_version', 'max_connections', 'shared_buffers', 'work_mem',\n    'maintenance_work_mem', 'effective_cache_size', 'max_wal_size',\n    'min_wal_size', 'wal_level', 'max_wal_senders', 'max_replication_slots',\n    'autovacuum', 'autovacuum_naptime', 'checkpoint_completion_target',\n    'random_page_cost'\n)\nORDER BY name"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [],
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          },
          "gridPos": {
            "x": 12,
            "y": 27,
            "w": 12,
            "h": 9
          }
        },
        {
          "id": 103,
          "type": "row",
          "title": "Redis — live state",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 12,
          "title": "Total keys",
          "type": "stat",
          "datasource": {
            "type": "redis-datasource",
            "uid": "redis-ds"
          },
          "description": "DBSIZE on the primary.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "redis-datasource",
                "uid": "redis-ds"
              },
              "type": "cli",
              "command": "",
              "query": "dbsize"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "color": {
