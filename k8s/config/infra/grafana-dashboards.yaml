                "uid": "prometheus-ds"
              },
              "expr": "(100 * (sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"})) / (sum by (pod) (container_spec_memory_limit_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}))) and on(pod) (max by (pod) (container_last_seen{namespace=~\"$namespace\"} @ end()) > scalar(max(timestamp(container_last_seen{namespace=~\"$namespace\"} @ end()))) - 120)",
