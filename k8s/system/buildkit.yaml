# Rootless BuildKit daemon used by GitHub Actions to build images.
#
# Kept as its own Deployment (not a sidecar) so that:
#   * the Maven/apt layer cache survives in a PVC between builds, and
#   * the runner pod needs no privileged container and no docker socket.
#
# Lives in pfa-system for the same reason as Vector: it needs
# seccompProfile: Unconfined and SELinux spc_t to run rootless on this Fedora
# node, and both are rejected by Baseline PSA. pfa enforces baseline; this
# namespace does not.
#
# The daemon speaks mutually authenticated TLS on 1234: `--tlscacert` makes
# BuildKit require and verify a client certificate (buildkitd main.go sets
# ClientAuth = RequireAndVerifyClientCert when a CA is supplied). Only holders
# of a CI client certificate can submit builds. NetworkPolicies narrow it
# further to the runner and the prune CronJob.
#
# Its registry client is mTLS too (the `keypair` block below): the registry
# rejects unauthenticated pushes and pulls.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: pfa-system
data:
  buildkitd.toml: |
    # BuildKit pushes to the registry over its ClusterIP Service, which is
    # stable regardless of the node's LAN IP. The registry serves HTTPS and
    # requires a client certificate; `keypair` is how BuildKit presents one.
    [registry."registry.pfa.svc.cluster.local:5000"]
      ca = ["/tls/ca.crt"]

      [[registry."registry.pfa.svc.cluster.local:5000".keypair]]
        cert = "/tls/client.crt"
        key = "/tls/client.key"

    # Cache retention. With no gcpolicy BuildKit falls back to
    # config.DetectDefaultGCCap(), which is 10% of the filesystem it can see.
    # buildkit-cache is a local-path PVC (hostPath, no quota), so that is 10%
    # of the whole 474 GiB root disk - about 48 GB, and the cache drifts there.
    #
    # Two things to know about how these rules are evaluated (cache/manager.go,
    # pruneOnce): keepBytes is compared against the WHOLE cache, not the size
    # of the matched records, and each rule deletes at most one record per GC
    # run. keepDuration is the opposite of what it sounds like - it PROTECTS
    # records used more recently than the duration, it does not expire them.
    [worker.oci]
      gc = true

      # Pin by omission: the base images every service build needs (maven,
      # eclipse-temurin, nginx, dockerfile frontend) match no rule below, so
      # nothing deletes them by duration. They are pulled from the in-cluster
      # mirror (base/*, see k8s/ci/mirror-base-images.sh), so a cold cache
      # costs a loopback pull rather than a Docker Hub download.
      #
      # The rules below instead name the categories that are cheap to rebuild.
      # A rule with keepDuration and no keepBytes deletes every matching record
      # idle for longer than the duration, in one pass - unlike a keepBytes cap,
      # which removes one record per GC run.
      #
      # Filters within one rule are ANDed, so each category needs its own rule.

      # finance/ocr-base layers come from the in-cluster registry over loopback
      # and a partial set is useless (a build needs all 16), so they go as soon
      # as the build that pulled them finishes. keepDuration 0 = no protection.
      #
      # The filter names the repository, not just the registry host: the
      # mirrored base images (base/maven, base/eclipse-temurin, base/nginx)
      # also come from that host and must NOT match this rule.
      [[worker.oci.gcpolicy]]
        filters = ['description~=registry\.pfa\.svc\.cluster\.local:5000/finance/ocr-base']
        keepDuration = "0s"

      # Build results: mvn/rm stage layers and the COPY/WORKDIR layers of newer
      # Dockerfiles. Worth keeping while the same source is being rebuilt, stale
      # after two idle days.
      [[worker.oci.gcpolicy]]
        filters = ['description~=^mount']
        keepDuration = "48h"

      [[worker.oci.gcpolicy]]
        filters = ['description~=^\[']
        keepDuration = "48h"

      # nvidia/cuda is only needed to rebuild the ocr-base image itself.
      [[worker.oci.gcpolicy]]
        filters = ['description~=docker\.io/nvidia']
        keepDuration = "336h"

      # Backstop: a plain LRU cap, so a record type nobody thought of cannot
      # grow without bound. At 60 GB it should never fire in normal use.
      [[worker.oci.gcpolicy]]
        keepBytes = "60GB"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: pfa-system
  labels:
    app: buildkitd
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: pfa-system
  labels:
    app: buildkitd
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      # Secret files are root:fsGroup with mode 0440; this makes them readable
      # by the rootless uid. OnRootMismatch keeps kubelet from recursively
      # chowning the 40 Gi cache on every start.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # local-path volumes are created root:root; the rootless daemon runs as
      # uid 1000, so hand the cache directory over first.
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /home/user/.local/share/buildkit && chown -R 1000:1000 /home/user/.local/share/buildkit
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.15.2-rootless
          imagePullPolicy: IfNotPresent
          args:
            - --addr=tcp://0.0.0.0:1234
            - --tlscacert=/tls/ca.crt
            - --tlscert=/tls/server.crt
            - --tlskey=/tls/server.key
            - --config=/etc/buildkit/buildkitd.toml
            - --oci-worker-no-process-sandbox
            - --oci-worker-snapshotter=native
          env:
            - name: HOME
              value: /home/user
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            # Required for rootless BuildKit on a SELinux (Enforcing) host,
            # which is the default on Fedora.
            seLinuxOptions:
              type: spc_t
            seccompProfile:
              type: Unconfined
          ports:
            - name: tcp
              containerPort: 1234
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: cache
              mountPath: /home/user/.local/share/buildkit
          readinessProbe:
            exec:
              command:
                - buildctl
                - --addr
                - tcp://127.0.0.1:1234
                - --tlscacert
                - /tls/ca.crt
                - --tlscert
                - /tls/client.crt
                - --tlskey
                - /tls/client.key
                - debug
                - workers
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          resources:
            # A Maven build of one Spring service sits around 1.5-2.5 GiB.
            # Capped so a build cannot take the whole node down with it.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # 6 cores made image builds pin every core and heat the laptop;
              # 4 still outruns the test suite and leaves headroom for builds
              # that overlap with a live deployment.
              cpu: "4"
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        - name: tls
          secret:
            secretName: ci-tls-buildkitd
            defaultMode: 0440
        - name: cache
          persistentVolumeClaim:
            claimName: buildkit-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: pfa-system
  labels:
    app: buildkitd
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: buildkitd
  ports:
    - name: tcp
      port: 1234
      targetPort: 1234
