entryPoints:
  web:
    address: ':8080'
    http:
      aliasHeadersStrategy: reject
    transport:
      respondingTimeouts:
        readTimeout: 120s
        writeTimeout: 0s
        idleTimeout: 180s
  # kubectl port-forward reaches pod loopback. No Service exposes this port.
  local-test:
    address: '127.0.0.1:8085'
    http:
      aliasHeadersStrategy: reject
    transport:
      respondingTimeouts:
        readTimeout: 120s
        writeTimeout: 0s
        idleTimeout: 180s
  management:
    address: ':9090'
    http:
      aliasHeadersStrategy: reject
ping:
  entryPoint: management
metrics:
  prometheus:
    entryPoint: management
    # Finer buckets so gateway latency percentiles are meaningful in ms
    # (Traefik's defaults are 0.1/0.3/1.2/5s, too coarse to read).
    buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10]
providers:
  file:
    filename: /etc/traefik/routes.yaml
    watch: false
log:
  level: INFO
  format: json
accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
    names:
      RequestPath: drop
      RequestLine: drop
      RequestAddr: drop
      ClientAddr: drop
      ClientHost: drop
