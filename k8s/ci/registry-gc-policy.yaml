    message: Registry maintenance cannot change pod shareProcessNamespace.
  - expression: (has(object.spec.template.spec.runtimeClassName) == has(oldObject.spec.template.spec.runtimeClassName)
      && (!has(object.spec.template.spec.runtimeClassName) || object.spec.template.spec.runtimeClassName == oldObject.spec.template.spec.runtimeClassName))
    message: Registry maintenance cannot change pod runtimeClassName.
  - expression: (has(object.spec.template.spec.imagePullSecrets) == has(oldObject.spec.template.spec.imagePullSecrets)
