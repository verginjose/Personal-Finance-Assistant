# Self-hosted GitHub Actions runner.
#
# The runner only orchestrates: builds execute in the buildkitd pod and images
# are pushed straight to the in-cluster registry. It therefore needs no
# privileged container and no docker socket.
#
# Registration uses a GitHub App (secret pfa-ci-secrets: APP_ID,
# APP_PRIVATE_KEY). A short-lived init container mints a one-hour runner
# registration token and writes it to an emptyDir; the long-running runner
# container never receives the App key. The app has Repository ->
# Administration:write only; it cannot read or write code. A PAT is not
# accepted: it could push to master, and Argo deploys master.
#
# The runner can scale only the isolated BuildKit deployment: it builds and pushes a tag-bump
# branch and opens its PR with the promotion job token. Validated bot promotions
# enable auto-merge; GitHub merges after the required checks pass and Argo CD
# deploys. Registration App permissions stay unchanged. No review token is used.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
---
# buildctl cache. Was a hostPath (/var/lib/pfa-ci/buildctl), which gave the
# runner a write primitive on the host. A PVC keeps the "download once" saving
# without exposing the host filesystem.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-buildctl
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: pfa
  labels:
    app: ci-runner
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      serviceAccountName: ci-runner
      # The runner holds no RBAC: it builds and proposes image tags through PRs.
      # There is no kubectl in the workflow, so it never needs a token.
      automountServiceAccountToken: false
      # fsGroup is the runner account's GID: the ci-tls-client Secret is mode
      # 0440, so without it the certs are root-readable only and job steps
      # running as `runner` cannot call buildkitd.
      securityContext:
        fsGroup: 121
      # Native sidecar: the App private key lives only in this container, which
      # mints a one-hour runner registration token and refreshes it every 45
      # minutes for the pod's lifetime. The runner container never sees APP_*,
      # and a container restart always finds a fresh token.
      initContainers:
        - name: mint-registration-token
          image: myoung34/github-runner:2.338.2-ubuntu-jammy
          imagePullPolicy: IfNotPresent
          # Native sidecar (k8s >= 1.29): starts before the runner and stays up.
          restartPolicy: Always
          # The App signing key is isolated under a separate UID. Only its
          # short-lived registration token is shared with the runner group.
          securityContext:
            runAsUser: 1002
            runAsGroup: 121
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: REPO
              value: verginjose/Personal-Finance-Assistant
            - name: APP_ID
              valueFrom:
                secretKeyRef: {name: pfa-ci-secrets, key: APP_ID}
            - name: APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: pfa-ci-secrets, key: APP_PRIVATE_KEY}
          command: ["/bin/bash", "-c"]
          args:
            - "set -uo pipefail\ntoken_file=/runner-registration/token\nb64url() { openssl base64 -A | tr '+/' '-_'
              | tr -d '='; }\nmint() {\n  local now exp header payload key sig jwt installation access token\n \
              \ now=$(date +%s); exp=$((now + 540))\n  header=$(printf %s '{\"alg\":\"RS256\",\"typ\":\"JWT\"}'
              | b64url)\n  payload=$(printf %s \"{\\\"iat\\\":${now},\\\"exp\\\":${exp},\\\"iss\\\":\\\"${APP_ID}\\\
              \"}\" | b64url)\n  key=\"$(mktemp)\"\n  printf '%s' \"${APP_PRIVATE_KEY//\\\\n/$'\\n'}\" > \"$key\"\
              \n  sig=$(printf %s \"${header}.${payload}\" | openssl dgst -sha256 -sign \"$key\" | b64url) || return
              1\n  rm -f \"$key\"\n  jwt=\"${header}.${payload}.${sig}\"\n  installation=$(curl -fsS -H \"Authorization:
              Bearer ${jwt}\" \\\n      -H 'Accept: application/vnd.github+json' \\\n      \"https://api.github.com/app/installations\"\
              \ \\\n    | jq -er --arg owner \"${REPO%%/*}\" \\\n        '[.[] | select(.account.login == $owner)
              | .id][0]') || return 1\n  access=$(curl -fsS -X POST -H \"Authorization: Bearer ${jwt}\" \\\n   \
              \   -H 'Accept: application/vnd.github+json' \\\n      \"https://api.github.com/app/installations/${installation}/access_tokens\"\
              \ \\\n    | jq -er .token) || return 1\n  token=$(curl -fsS -X POST -H \"Authorization: Bearer ${access}\"\
              \ \\\n      -H 'Accept: application/vnd.github+json' \\\n      \"https://api.github.com/repos/${REPO}/actions/runners/registration-token\"\
              \ \\\n    | jq -er .token) || return 1\n  printf '%s' \"$token\" > \"${token_file}.new\"\n  chmod
              640 \"${token_file}.new\"\n  mv \"${token_file}.new\" \"$token_file\"\n  echo \"registration token
              refreshed\"\n}\n# Registration tokens are valid for one hour; refresh at 45 min.\nwhile true; do\n\
              \  if mint; then sleep 2700; else echo \"token refresh failed; retrying in 30s\" >&2; sleep 30; fi\n\
              done\n"
          volumeMounts:
            - name: runner-registration
              mountPath: /runner-registration
      containers:
        - name: runner
          image: myoung34/github-runner:2.338.2-ubuntu-jammy
          imagePullPolicy: IfNotPresent
          # Registration and job execution both run as the unprivileged runner.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          # The short-lived registration token is group-readable. The App private
          # key remains isolated in the sidecar and is never passed to jobs.
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 121
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-c"]
          args:
            - "set -euo pipefail\ntoken_file=/runner-registration/token\nfor _ in $(seq 1 120); do\n  [ -s \"$token_file\"\
              \ ] && break\n  sleep 1\ndone\n[ -s \"$token_file\" ] || { echo '::error::registration token was not
              minted'; exit 1; }\nRUNNER_TOKEN=\"$(cat \"$token_file\")\"\nexport RUNNER_TOKEN\nexec /entrypoint.sh
              /actions-runner/run.sh\n"
          env:
            # Jobs run as `runner`, so HOME must point at a directory that
            # user owns; the image's default is /root.
            - name: HOME
              value: /home/runner
            - name: RUN_AS_ROOT
              value: "false"
            - name: REPO_URL
              value: https://github.com/verginjose/Personal-Finance-Assistant
            - name: RUNNER_NAME
              value: pfa-k3s
            # Git commit attribution; API-created PRs are authored by
            # github-actions[bot], the owner of the short-lived job token.
            - name: CI_COMMITTER_NAME
              value: PennyPilot
            - name: CI_COMMITTER_EMAIL
              value: ci@verginjose.local
            - name: RUNNER_SCOPE
              value: repo
            - name: RUNNER_WORKDIR
              value: /tmp/runner/work
            # Labels must match `runs-on:` in .github/workflows/build.yml.
            - name: LABELS
              value: self-hosted,linux,x64,pfa
            # /certs holds the *buildkitd* client certificate only. The
            # registry uses a separate identity (ci-tls-registry-client) that
            # this pod deliberately does not mount, so a compromised build
            # cannot push or delete images.
            - name: UNSET_CONFIG_VARS
              value: 'true'
          volumeMounts:
            - name: work
              mountPath: /tmp/runner
            - name: buildkit-control
              mountPath: /var/run/pfa-buildkit
              readOnly: true
            - name: runner-registration
              mountPath: /runner-registration
            # buildctl is downloaded once per node, not once per job: the
            # GitHub release download takes ~2.5 minutes on this link and used
            # to dominate every OCR build.
            - name: buildctl
              mountPath: /opt/buildctl
            # buildkitd client identity (skopeo-style client.cert/client.key).
            - name: ci-tls
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "Runner.Listener"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: buildkit-control
          projected:
            defaultMode: 292
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: work
          emptyDir: {}
        - name: runner-registration
          emptyDir: {}
        - name: buildctl
          persistentVolumeClaim:
            claimName: ci-buildctl
        - name: ci-tls
          secret:
            secretName: ci-tls-client
            defaultMode: 288
