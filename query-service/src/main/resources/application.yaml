server:
  port: 8084
  tomcat:
    # Tomcat defaults to closing a connection after 100 keep-alive requests.
    # The gateway holds those connections in its own pool, so the server-side
    # close races a request the gateway has already written onto the connection,
    # which surfaces as a ~0.1 ms PrematureCloseException and counts as a
    # circuit-breaker failure. The gateway already recycles connections itself
    # (max-idle-time 10 s, max-life-time 60 s), so let it own the lifetime.
    max-keep-alive-requests: -1

spring:
  threads:
    virtual:
      enabled: true

  # ── Database ────────────────────────────────────────────────────────────────
  jpa:
    properties:
      hibernate:
        default_schema: finance
  datasource:
    hikari:
      # The 50-user scenario keeps ~50 analytics/read calls in flight. At 30
      # connections the pool saturates (active=30, idle=0, waiting≈47) and
      # 5 s connection timeouts turn into 500s. The replica allows 200
      # connections and was using ~30, so 60 leaves plenty of headroom; the
      # timeout is also raised so a burst waits instead of failing.
      maximum-pool-size: 60
      minimum-idle: 5
      connection-timeout: 15000

  # ── Redis & Caching ─────────────────────────────────────────────────────────
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 200ms


# Shared secret for the OCR HTTP API (X-Internal-Token).
internal:
  api:
    token: ${INTERNAL_API_TOKEN:}

# ── Groq AI Configuration (for AI Insights feature) ──────────────────────────
groq:
  api:
    key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  url: ${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}

# ── FX rates (amountDefault) ────────────────────────────────────────────────
# ECB reference rates via Frankfurter; no key. Rates are cached in memory for
# the TTL and the last good snapshot is reused if a refresh fails. When no rate
# is known the entry's amountDefault stays null and the UI shows the original.
fx:
  rates:
    url: ${FX_RATES_URL:https://api.frankfurter.dev/v1/latest}
    ttl-minutes: ${FX_RATES_TTL_MINUTES:360}
    failure-backoff-seconds: ${FX_RATES_FAILURE_BACKOFF_SECONDS:60}
    timeout-seconds: ${FX_RATES_TIMEOUT_SECONDS:5}

# ── Actuator & Metrics ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: analytics-service
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0