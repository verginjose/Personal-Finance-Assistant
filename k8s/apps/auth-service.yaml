apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: auth-service
          image: 192.168.0.7:30500/finance/auth-service:3bdb19d50e52
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: DB_PASSWORD }
            - name: AUTH_DB_SCHEMA
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: AUTH_DB_SCHEMA }

            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres-primary:5432/$(DB_NAME)?schema=$(AUTH_DB_SCHEMA)
            - name: SPRING_R2DBC_USERNAME
              value: $(DB_USER)
            - name: SPRING_R2DBC_PASSWORD
              value: $(DB_PASSWORD)

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: JWT_SECRET }
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: JWT_EXPIRATION }

            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: REDIS_PASSWORD }

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
