    message: Registry maintenance cannot change container startupProbe.
  - expression: (has(object.spec.template.spec.containers[0].livenessProbe) == has(oldObject.spec.template.spec.containers[0].livenessProbe)
      && (!has(object.spec.template.spec.containers[0].livenessProbe) || object.spec.template.spec.containers[0].livenessProbe
      == oldObject.spec.template.spec.containers[0].livenessProbe))
    message: Registry maintenance cannot change container livenessProbe.
  - expression: (has(object.spec.template.spec.containers[0].readinessProbe) == has(oldObject.spec.template.spec.containers[0].readinessProbe)
      && (!has(object.spec.template.spec.containers[0].readinessProbe) || object.spec.template.spec.containers[0].readinessProbe
      == oldObject.spec.template.spec.containers[0].readinessProbe))
    message: Registry maintenance cannot change container readinessProbe.
  - expression: (has(object.spec.template.spec.containers[0].ports) == has(oldObject.spec.template.spec.containers[0].ports)
      && (!has(object.spec.template.spec.containers[0].ports) || object.spec.template.spec.containers[0].ports ==
      oldObject.spec.template.spec.containers[0].ports))
    message: Registry maintenance cannot change container ports.
  - expression: (has(object.spec.template.spec.containers[0].resources) == has(oldObject.spec.template.spec.containers[0].resources)
      && (!has(object.spec.template.spec.containers[0].resources) || object.spec.template.spec.containers[0].resources
      == oldObject.spec.template.spec.containers[0].resources))
    message: Registry maintenance cannot change container resources.
  - expression: (has(object.spec.template.spec.containers[0].terminationMessagePath) == has(oldObject.spec.template.spec.containers[0].terminationMessagePath)
      && (!has(object.spec.template.spec.containers[0].terminationMessagePath) || object.spec.template.spec.containers[0].terminationMessagePath
