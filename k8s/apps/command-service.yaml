apiVersion: v1
kind: Service
metadata:
  name: command-service
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: command-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
# Non-secret configuration for this service only. Credentials live in the
# command-service-secrets Secret, rendered by k8s/apply.sh from
# env/command-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: command-service-config
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  # Rust service settings only. DB_USER/DB_PASSWORD/DB_NAME/REDIS_PASSWORD and
  # INTERNAL_API_TOKEN come from command-service-secrets; DB_HOST defaults to
  # postgres-primary (the write side of CQRS).
  REDIS_HOST: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-service
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: command-service
  template:
    metadata:
      labels:
        app: command-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Read-only root filesystem; 65534 is `nobody`, used by the Rust image.
      securityContext:
        fsGroup: 65534
      containers:
        - name: command-service
          image: 127.0.0.1:30500/finance/command-service:4313d4020ba1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: command-service-config
            - secretRef:
                name: command-service-secrets
          env:
            # Write side of CQRS: always hits the primary. The Rust service
            # reads JSON logs straight to stdout for the Vector pipeline.
            - name: DB_HOST
              value: postgres-primary
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              # Host has 16 vCPU; 3 keeps the write path responsive under the
              # 50-user scenario while leaving cores for the desktop.
              cpu: "3"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
