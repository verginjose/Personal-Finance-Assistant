server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  # No defaults: a missing credential must fail at startup, not silently fall
  # back to the well-known admin/password123 pair.
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:receipts}
  profileBucket: ${MINIO_PROFILE_BUCKET:profiles}

spring:
  codec:
    max-in-memory-size: 12MB
  webflux:
    multipart:
      max-in-memory-size: 12MB

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 50
          max-idle: 10
          min-idle: 2
          max-wait: 200ms

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        pool:
          # Recycle idle connections before Tomcat's keep-alive timeout
          # (server.tomcat.connection-timeout, default 20 s) closes them. A
          # pooled connection the backend has already closed fails the next
          # request in ~0.1 ms with PrematureCloseException; that is the
          # transient error the circuit breaker was counting as a dependency
          # failure under bursty load. Recycling at 10 s keeps the pool ahead
          # of the backend.
          max-idle-time: 10s
          max-life-time: 60s
          # max-idle-time is only enforced by the periodic eviction sweep, so a
          # stale connection can otherwise survive up to the sweep interval.
          # 5 s keeps the pool ahead of Tomcat's 20 s keep-alive timeout.
          eviction-interval: 5s
          # Expose reactor.netty.connection.provider.* (allocated, idle,
          # pending, created) so pool behaviour is visible during load tests.
          metrics: true
      routes:
        # Rate-limit policy (per key, so it never binds aggregate throughput —
        # a 1,000 req/s run across 200 users recorded zero 429s). The buckets
        # below cap a *single* abusive key, not the fleet:
        #   login/register  5/s  per IP+path   (brute-force)
        #   auth refresh/me 100/s per IP+path  (multiple tabs; NAT cohorts)
        #   writes          20/s per user      (≈16/s is the test's write pace)
        #   reads           50/s per user      (dashboard + filters)
        #   analytics       10/s per user      (expensive; burst absorbs a
        #                                       dashboard's parallel chart calls)
        # Credential endpoints get a human-sized bucket (IP + path), separate
        # from the general auth route. Must come before the /api/auth/** route
        # because the first matching route wins.
        - id: auth-credentials
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/login,/api/auth/register
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipPathKeyResolver}"
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth

        # Auth lives in its own service now. The path is forwarded unchanged
        # (/api/auth/** -> auth-service /api/auth/**). Refresh and /me are
        # legitimately bursty (multiple tabs), so they keep a wider bucket
        # than the user-scoped routes — but still bounded per source IP.
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipPathKeyResolver}"
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth

        - id: command-service-sse
          uri: http://command-service:8081
          predicates:
            - Path=/api/upsert/notifications/**
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: 1800000
            connect-timeout: 5000

        - id: command-service-command
          uri: http://command-service:8081
          predicates:
            - Path=/api/upsert/**
            - Method=POST,PUT,PATCH,DELETE
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: upsert-cb
                fallbackUri: forward:/fallback/upsert

        - id: command-service-query
          uri: http://query-service:8084
          predicates:
            - Path=/api/upsert/**
            - Method=GET
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: analytics-cb
                fallbackUri: forward:/fallback/analytics

        - id: query-service
          uri: http://query-service:8084
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: analytics-cb
                fallbackUri: forward:/fallback/analytics



        # /api/storage/** is NOT proxied to MinIO. It is served by
        # StorageDownloadController, which is the only reader and hardens the
        # response headers. Objects are private (no bucket policy).

resilience4j:
  circuitbreaker:
    instances:
      # Sized for ~50 concurrent writers. A 10-sample window plus a 3s slow
      # threshold opened the breaker as soon as Postgres queued; the window is
      # now wide enough that a brief burst cannot trip it by itself, and 300
      # samples ride out the slow tail the group-expense path produces.
      #
      # The failure threshold is 80%, not 60%, on purpose. Under the 50-user
      # scenario the breaker was tripping while the backend was healthy: the
      # failed calls averaged ~0.15 ms (transport-level socket errors on
      # recycled keep-alive connections), the slow-call rate stayed 0, no
      # service returned 5xx, and no error was logged. A breaker is there to
      # stop hammering a dependency that is down — a dependency that is down
      # fails ~100%, so 80% still trips within one window while a burst of
      # transient per-call errors no longer takes the whole route offline.
      upsert-cb:
        sliding-window-size: 300
        minimum-number-of-calls: 100
        failure-rate-threshold: 80
        # A saturated admission-control semaphore is not a dependency failure.
        # Counting it opened the breaker while every backend was healthy.
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 10
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 85
      analytics-cb:
        sliding-window-size: 150
        minimum-number-of-calls: 60
        failure-rate-threshold: 80
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-duration-threshold: 20s
        slow-call-rate-threshold: 80
      auth-cb:
        sliding-window-size: 50
        minimum-number-of-calls: 30
        failure-rate-threshold: 60
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 85
      ocr-cb:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
        wait-duration-in-open-state: 45s
        permitted-number-of-calls-in-half-open-state: 4
        slow-call-duration-threshold: 20s
        slow-call-rate-threshold: 70
  timelimiter:
    instances:
      # Must stay above the slow-call threshold: a cancelled call counts as a
      # failure and feeds the breaker.
      upsert-cb:
        timeout-duration: 15s
      analytics-cb:
        timeout-duration: 45s
      ocr-cb:
        timeout-duration: 60s
      auth-cb:
        timeout-duration: 15s
  # Spring Cloud CircuitBreaker installs a Resilience4j semaphore bulkhead per
  # circuit breaker using Resilience4j's defaults: 25 concurrent calls with no
  # wait. The 50-user scenario exceeds 25 in-flight calls on every route, so
  # the semaphore rejected calls with BulkheadFullException in ~0.07 ms and the
  # rejection was recorded as a circuit-breaker failure — that is the "~0.1 ms
  # transport error" that tripped the breakers. Size each bulkhead at the
  # concurrency its backend is provisioned for; it still bounds in-flight
  # calls, but well above the working set. max-wait-duration stays 0 because a
  # waiting semaphore blocks the single gateway event-loop thread.
  bulkhead:
    instances:
      upsert-cb:
        max-concurrent-calls: 200
        max-wait-duration: 0ms
      analytics-cb:
        max-concurrent-calls: 200
        max-wait-duration: 0ms
      auth-cb:
        # The refresh-race probe fires 4 concurrent refreshes per user, so 100
        # users can present ~400 auth calls at once. auth-service's R2DBC (50)
        # and Lettuce (50) pools are sized for it.
        max-concurrent-calls: 400
        max-wait-duration: 0ms
      ocr-cb:
        max-concurrent-calls: 50
        max-wait-duration: 0ms

logging:
  level:
    root: INFO
    com.apigateway: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
    org.springframework.security: INFO

management:
  # Metrics/health live on their own port. The public Service (and therefore
  # the ingress) only maps 8080, so /actuator/prometheus is not reachable from
  # the internet; Prometheus scrapes the pod directly on 9090.
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0