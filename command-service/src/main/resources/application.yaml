server:
  port: 8081
  tomcat:
    # Tomcat defaults to closing a connection after 100 keep-alive requests.
    # The gateway holds those connections in its own pool, so the server-side
    # close races a request the gateway has already written onto the connection,
    # which surfaces as a ~0.1 ms PrematureCloseException and counts as a
    # circuit-breaker failure. The gateway already recycles connections itself
    # (max-idle-time 10 s, max-life-time 60 s), so let it own the lifetime.
    max-keep-alive-requests: -1

spring:
  threads:
    virtual:
      enabled: true

  jpa:
    properties:
      hibernate:
        default_schema: finance
    open-in-view: false

  mvc:
    async:
      request-timeout: 1800000

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms


# ── Downstream service URLs ───────────────────────────────────────────────────
analytics:
  service:
    url: ${ANALYTICS_SERVICE_URL:http://analytics-service:8084}

# ── Custom DataSources for Read/Write Split ──────────────────────────────────
app:
  datasource:
    write:
      jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance_assistant}
      username: ${SPRING_DATASOURCE_USERNAME:finance_user}
      password: ${SPRING_DATASOURCE_PASSWORD:finance_pass}
      pool-name: HikariPool-write
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 5000
      max-lifetime: 1800000
    read:
      jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance_assistant}
      username: ${SPRING_DATASOURCE_USERNAME:finance_user}
      password: ${SPRING_DATASOURCE_PASSWORD:finance_pass}
      pool-name: HikariPool-read
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
      connection-init-sql: SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY

# ── Actuator & Metrics ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: upsert-service
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
