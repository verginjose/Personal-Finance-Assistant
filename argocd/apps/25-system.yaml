# Workloads that must live outside pfa's Pod Security Admission enforcement:
# Vector (hostPath log mounts) and the rootless BuildKit daemon (seccomp
# Unconfined + SELinux spc_t). Both are first-party daemons, not tenant
# workloads, so this namespace is kept separate rather than weakening pfa.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-system
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/verginjose/Personal-Finance-Assistant.git
    targetRevision: master
    path: k8s/system
  destination:
    server: https://kubernetes.default.svc
    namespace: pfa-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
