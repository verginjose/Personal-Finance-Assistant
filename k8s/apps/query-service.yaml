apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: query-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
# Non-secret configuration for this service only. Credentials live in the
# query-service-secrets Secret, rendered by k8s/apply.sh from
# env/query-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: query-service-config
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  REDIS_HOST: redis
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: guest
  GROQ_MODEL: openai/gpt-oss-120b
  GROQ_URL: https://api.groq.com/openai/v1/chat/completions
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ZGenerational -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: query-service
          image: 127.0.0.1:30500/finance/query-service:94148f0dd9fa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: query-service-config
            - secretRef:
                name: query-service-secrets
          env:
            # Read side of CQRS: reads from the streaming replica.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-replica:5432/$(DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              value: $(DB_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(DB_PASSWORD)
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
            - name: SPRING_DATASOURCE_HIKARI_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
            # Spring's Redis property expects a different name than the
            # REDIS_PASSWORD the Secret stores.
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: query-service-secrets, key: REDIS_PASSWORD }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
