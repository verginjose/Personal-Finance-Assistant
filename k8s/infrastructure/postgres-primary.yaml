apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: pfa
  labels:
    app: postgres-primary
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: postgres-primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: pfa
  labels:
    app: postgres-primary
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        # Restart only for the credentials this workload reads, not for every
        # Secret in the namespace.
        secret.reloader.stakater.com/reload: "postgres-secrets,postgres-tls"
        configmap.reloader.stakater.com/reload: "postgres-security"
    spec:
      containers:
        - name: postgres
          image:
            pgvector/pgvector:pg15-bookworm@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
          imagePullPolicy: IfNotPresent
          # Each WAL flush on this host costs ~4.6 ms (LUKS + consumer NVMe),
          # so the default commit path measured 9 ms / 110 tps. Turning
          # synchronous_commit off lets COMMIT return once the WAL record is in
          # the page cache; the WAL writer flushes within ~200-600 ms.
          #
          # Tradeoff: a power cut or kernel panic can lose the last few hundred
          # ms of *committed* transactions. It cannot corrupt anything, and it
          # does not apply to process crashes, OOM kills or pod restarts -- the
          # page cache survives those. Revert to "on" if that window matters.
          #
          # Sized for this host (16 vCPU / 23 GiB shared with the desktop):
          #   200 connections covers the service pools (40+25+30 Hikari plus
          #   auth-service's R2DBC pool) with room to spike, while a 4 GiB
          #   container keeps shared_buffers at 1 GiB and leaves the OS page
          #   cache for the rest. max_connections must match on the replica or
          #   it refuses hot standby.
          args:
            - "-c"
            - "synchronous_commit=off"
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=1GB"
            - "-c"
            - "effective_cache_size=3GB"
            - "-c"
            - "work_mem=8MB"
            - "-c"
            - "maintenance_work_mem=256MB"
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/postgres-security/pg_hba.conf
            - -c
            - ident_file=/etc/postgres-security/pg_ident.conf
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-secrets, key: DB_NAME}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-secrets, key: DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secrets, key: DB_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/postgres-tls/ca.crt
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: postgres-security
              mountPath: /etc/postgres-security
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            # One core was the bottleneck behind the gateway's 3s slow-call
            # tail and the upsert-cb trips at ~10 concurrent writers. The host
            # has 16 vCPU; give the write path room to queue in Postgres rather
            # than in the gateway, but stop at 6 so the desktop keeps cores.
            limits:
              cpu: "6"
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: initdb
          configMap:
            name: postgres-init
            defaultMode: 493
        - name: socket
          emptyDir: {}
        - name: postgres-tls
          secret:
            secretName: postgres-tls
            defaultMode: 288
        - name: postgres-security
          configMap:
            name: postgres-security
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
