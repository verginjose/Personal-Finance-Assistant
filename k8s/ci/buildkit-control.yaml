# The runner may operate this one builder, never read Secrets or exec pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildkit-demand
  namespace: pfa-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [buildkitd]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [buildkitd]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildkit-demand
  namespace: pfa-system
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: pfa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildkit-demand
