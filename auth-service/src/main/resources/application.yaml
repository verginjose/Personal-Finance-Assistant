server:
  port: 8082
  tomcat:
    # Tomcat defaults to closing a connection after 100 keep-alive requests.
    # The gateway holds those connections in its own pool, so the server-side
    # close races a request the gateway has already written onto the connection,
    # which surfaces as a ~0.1 ms PrematureCloseException and counts as a
    # circuit-breaker failure. The gateway already recycles connections itself
    # (max-idle-time 10 s, max-life-time 60 s), so let it own the lifetime.
    max-keep-alive-requests: -1

jwt:
  secret: ${JWT_SECRET}
  # access-token lifetime; JwtService reads access-expiration-ms
  expiration: ${JWT_EXPIRATION:900000}
  access-expiration-ms: ${JWT_EXPIRATION:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

spring:
  application:
    name: auth-service

  codec:
    max-in-memory-size: 1MB

  # auth.users is created by the db-init Job (db-init/007_create_auth_users.sql),
  # not at boot: with >1 replica, concurrent DDL would race.
  sql:
    init:
      mode: never

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://postgres-primary:5432/pfa?schema=auth}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      # 100 simulated users, and the refresh-race probe fires 4 concurrent
      # refreshes per user, so up to ~400 auth calls can be resident at once.
      # The pools must be sized with the gateway's auth-cb bulkhead (400) or
      # the calls simply queue here instead of being admitted.
      initial-size: 10
      max-size: 50
      max-acquire-time: 10s
      max-idle-time: 30m

  data:
    redis:
      host: ${REDIS_HOST:redis}
      # NOT REDIS_PORT: Kubernetes injects REDIS_PORT=tcp://<ip>:6379 into every
      # pod in a namespace that has a single-port Service named "redis", which
      # breaks binding to an int. Use our own variable name.
      port: ${REDIS_SERVER_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          # Lettuce multiplexes simple commands on a connection, so the pool is
          # only a concurrency valve. At 50 the golden test's refresh-rotation
          # burst (400 concurrent replays x ~3 commands) queued long enough
          # that the *losing* GETDEL calls took longer (442 ms) than the
          # winners (357 ms). 200 leaves the node ample headroom.
          max-active: 200
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms

logging:
  level:
    root: INFO
    com.authservice: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: auth-service
