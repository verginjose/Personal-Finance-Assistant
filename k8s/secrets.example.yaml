# Template only — do NOT commit real values.
#
# This is the *infrastructure* Secret. Postgres, Redis, MinIO, ClickHouse,
# Grafana, Vector and cloudflared read it. Application services no longer use
# it: each has its own `<service>-secrets` Secret, rendered from
# `env/<service>.env` (see env/README.md).
#
# `k8s/apply.sh` builds this Secret from the repo-level `.env` with:
#   kubectl create secret generic pfa-secrets -n pfa --from-env-file=.env ...
#
# If you prefer to manage it by hand, copy this file, fill in the values and run
#   kubectl apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pfa-secrets
  namespace: pfa
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
type: Opaque
stringData:
  # Database
  DB_NAME: pfa_db
  DB_USER: pfa_admin
  DB_PASSWORD: change-me
  FINANCE_DB_SCHEMA: finance
  AUTH_DB_SCHEMA: auth

  # Redis (empty string = no auth)
  REDIS_PASSWORD: change-me

  # JWT
  JWT_SECRET: change-me-at-least-32-bytes-long
  JWT_EXPIRATION: "86400000"

  # MinIO
  MINIO_ROOT_PASSWORD: change-me

  # ClickHouse
  CLICKHOUSE_PASSWORD: change-me
  GRAFANA_ADMIN_PASSWORD: change-me

  # Groq AI
  GROQ_API_KEY: change-me
  GROQ_MODEL: llama3-8b-8192
  GROQ_URL: https://api.groq.com/openai/v1/chat/completions

  # Optional: Cloudflare tunnel (only used with k8s/optional/cloudflared.yaml)
  CLOUDFLARE_TUNNEL_TOKEN: change-me
