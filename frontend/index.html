<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Varavu — personal finance, kept straight</title>
  <meta name="description" content="Varavu keeps every account, receipt and shared bill in one calm ledger.">
  <meta name="theme-color" content="#F2F3EE">
  <link rel="icon" type="image/png" href="/assets/varavu-mark.png">
  <link rel="apple-touch-icon" href="/assets/varavu-mark.png">
  <script>
    // Resolve the theme before first paint so there is no flash.
    (function () {
      try {
        var pref = localStorage.getItem('pfa_theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#141A22' : '#F2F3EE');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css?v=2026110504">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Cropper.js for the profile picture -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" crossorigin="anonymous" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Flatpickr date pickers -->
  <!-- crossorigin lets flatpickr read cssRules; without it the picker throws
       a SecurityError from a cross-origin stylesheet. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js" crossorigin="anonymous"></script>

  <!-- Tom Select for searchable selects -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js?v=2026110504"></script>
</body>
</html>
