apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: query-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
# Non-secret configuration for this service only. Credentials live in the
# query-service-secrets Secret, rendered by k8s/apply.sh from
# env/query-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: query-service-config
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  # Rust service settings only. DB_USER/DB_PASSWORD/DB_NAME/REDIS_PASSWORD and
  # GROQ_API_KEY come from query-service-secrets; the service defaults DB_HOST
  # to postgres-replica and DB_PORT to 5432.
  REDIS_HOST: redis
  GROQ_MODEL: openai/gpt-oss-120b
  GROQ_URL: https://api.groq.com/openai/v1/chat/completions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: pfa
  labels:
    app: query-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Read-only root filesystem; 65534 is `nobody`, used by the Rust image.
      securityContext:
        fsGroup: 65534
      containers:
        - name: query-service
          image: 127.0.0.1:30500/finance/query-service:b5874afbded6
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: query-service-config
            - secretRef:
                name: query-service-secrets
          # CQRS read side: DB_HOST defaults to postgres-replica. The service
          # writes JSON logs to stdout for the Vector -> ClickHouse pipeline.
          # Right-sized for the Rust service: it idles at ~2 MiB (cgroup
          # total ~5 MiB), so 256Mi leaves ample headroom for the sqlx pool
          # and streamed CSV exports. The old Spring numbers (512Mi request /
          # 3Gi limit) reserved memory it never used.
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: "3"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
