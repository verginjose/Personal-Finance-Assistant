apiVersion: v1
kind: ConfigMap
metadata:
  name: laptop-health-script
  namespace: pfa-system
data:
  laptop_guard.py: "#!/usr/bin/env python3\n\"\"\"Fail-closed hardware guard for this\
    \ laptop. Limits cannot be relaxed by CLI.\"\"\"\nimport argparse\nfrom collections\
    \ import deque\nfrom datetime import datetime, timezone\nfrom http.server import\
    \ BaseHTTPRequestHandler, ThreadingHTTPServer\nimport json\nimport math\nimport\
    \ os\nfrom pathlib import Path\nimport signal\nimport ssl\nimport subprocess\n\
    import threading\nimport time\nimport urllib.error\nimport urllib.request\n\n\
    LIMITS = dict(cpu_c=78, gpu_c=65, ssd_c=70, available_gib=6, cpu_percent=80)\n\
    CRITICAL = dict(cpu_c=85, gpu_c=75, ssd_c=82)\nTHERMAL_CONFIRM_SECONDS = dict(cpu_c=2,\
    \ gpu_c=2, ssd_c=5)\n# The display keeps this laptop's GPU around 50\u201352C\
    \ at idle. Keep ten\n# degrees of headroom while allowing a genuinely idle laptop\
    \ to start.\nSTART = dict(cpu_c=65, gpu_c=55, ssd_c=60, available_gib=8, cpu_percent=50)\n\
    FRESH_SECONDS = 3\nCOOL_SECONDS = 60\n\n\ndef invalid_sample(sample, now=None):\n\
    \    now = time.time() if now is None else now\n    if not isinstance(sample,\
    \ dict):\n        return 'malformed hardware telemetry'\n    stamp = sample.get('timestamp')\n\
    \    if (sample.get('valid') is not True or not isinstance(stamp, (int, float))\n\
    \            or not math.isfinite(stamp) or not 0 <= now - stamp <= FRESH_SECONDS):\n\
    \        return 'hardware telemetry missing, invalid or stale'\n    for key in\
    \ LIMITS:\n        value = sample.get(key)\n        if not isinstance(value, (int,\
    \ float)) or not math.isfinite(value):\n            return f'{key} unavailable'\n\
    \    if not isinstance(sample.get('swapout_total'), int) or sample['swapout_total']\
    \ < 0:\n        return 'swap-out telemetry unavailable'\n    pressure = sample.get('memory_pressure_full',\
    \ float('nan'))\n    if not isinstance(pressure, (int, float)) or not math.isfinite(pressure)\
    \ or pressure > 1:\n        return 'memory pressure exceeds 1%'\n    return None\n\
    \n\ndef violation(sample, starting=False, now=None):\n    \"\"\"Raw limits, also\
    \ used to avoid arming during a pending hot reading.\"\"\"\n    error = invalid_sample(sample,\
    \ now)\n    if error:\n        return error\n    limits = START if starting else\
    \ LIMITS\n    for key, limit in limits.items():\n        value = sample[key]\n\
    \        high = value > limit if starting else value >= limit\n        if (key\
    \ == 'available_gib' and value < limit) or (key != 'available_gib' and high):\n\
    \            return f'{key}={value:.2f} reached safety limit {limit}'\n    return\
    \ None\n\n\ndef utc(stamp):\n    try:\n        return datetime.fromtimestamp(stamp,\
    \ timezone.utc).isoformat().replace('+00:00', 'Z')\n    except (ValueError, OverflowError,\
    \ OSError, TypeError):\n        return None\n\n\nclass SafetyWindow:\n    \"\"\
    \"Confirm ordinary heat using sensor time, never repeated HTTP samples.\"\"\"\n\
    \    def __init__(self, starting=False):\n        self.starting = starting\n \
    \       self.hot = {}\n        self.last_stamp = None\n        self.events = deque(maxlen=64)\n\
    \        self.immediate = False\n        self.previous_swap = None\n\n    def\
    \ check(self, sample, now=None):\n        self.immediate = True\n        error\
    \ = invalid_sample(sample, now)\n        if error:\n            return error\n\
    \        if not self.starting and sample.get('safety_trip'):\n            return\
    \ 'server watchdog tripped: ' + str(sample['safety_trip'])\n        swap = sample['swapout_total']\n\
    \        previous_swap, self.previous_swap = self.previous_swap, swap\n      \
    \  if previous_swap is not None and swap != previous_swap:\n            return\
    \ 'active swap-out' if swap > previous_swap else 'swap-out counter moved backwards'\n\
    \        limits = START if self.starting else LIMITS\n        if sample['available_gib']\
    \ < limits['available_gib']:\n            return f\"available_gib={sample['available_gib']:.2f}\
    \ below safety limit {limits['available_gib']}\"\n        busy = sample['cpu_percent']\
    \ > limits['cpu_percent'] if self.starting else sample['cpu_percent'] >= limits['cpu_percent']\n\
    \        if busy:\n            return 'host CPU utilization reached safety limit'\n\
    \        for key, limit in CRITICAL.items():\n            if sample[key] >= limit:\n\
    \                event = dict(kind='critical', sensor=key, value=sample[key],\
    \ limit=limit,\n                             sample_utc=utc(sample['timestamp']))\n\
    \                if not self.events or self.events[-1] != event:\n           \
    \         self.events.append(event)\n                return f'{key}={sample[key]:.2f}\
    \ reached immediate critical limit {limit}'\n        self.immediate = False\n\
    \        stamp = sample['timestamp']\n        if self.last_stamp is not None and\
    \ stamp < self.last_stamp:\n            self.immediate = True\n            return\
    \ 'hardware telemetry timestamp moved backwards'\n        fresh = stamp != self.last_stamp\n\
    \        self.last_stamp = stamp\n        for key in CRITICAL:\n            high\
    \ = sample[key] > limits[key] if self.starting else sample[key] >= limits[key]\n\
    \            if not high:\n                previous = self.hot.pop(key, None)\n\
    \                if previous:\n                    self.events.append(dict(kind='cleared',\
    \ sensor=key, first_sample_utc=utc(previous['first']),\n                     \
    \                       sample_utc=utc(stamp), peak=previous['peak']))\n     \
    \           continue\n            if key not in self.hot:\n                self.hot[key]\
    \ = dict(first=stamp, peak=sample[key])\n                self.events.append(dict(kind='warning',\
    \ sensor=key, value=sample[key], limit=limits[key],\n                        \
    \                sample_utc=utc(stamp)))\n            self.hot[key]['peak'] =\
    \ max(self.hot[key]['peak'], sample[key])\n            if fresh and stamp - self.hot[key]['first']\
    \ >= THERMAL_CONFIRM_SECONDS[key]:\n                event = dict(kind='confirmed',\
    \ sensor=key, value=sample[key], limit=limits[key],\n                        \
    \     first_sample_utc=utc(self.hot[key]['first']), sample_utc=utc(stamp),\n \
    \                            duration_seconds=round(stamp-self.hot[key]['first'],\
    \ 3))\n                self.events.append(event)\n                return f'{key}={sample[key]:.2f}\
    \ exceeded {limits[key]} for {event[\"duration_seconds\"]}s'\n        return None\n\
    \n\nclass Sensors:\n    def __init__(self, sys_root='/sys', proc_root='/proc'):\n\
    \        self.sys_root, self.proc_root = Path(sys_root), Path(proc_root)\n   \
    \     self.previous_cpu = None\n        self.previous_swap = None\n\n    def sample(self):\n\
    \        result = {'timestamp': time.time(), 'valid': False}\n        try:\n \
    \           cpu, ssd = [], []\n            for folder in (self.sys_root / 'class/hwmon').glob('hwmon*'):\n\
    \                name = (folder / 'name').read_text().strip()\n              \
    \  if name in ('coretemp', 'k10temp'):\n                    cpu += [float(p.read_text())\
    \ / 1000 for p in folder.glob('temp*_input')]\n                elif name == 'nvme':\n\
    \                    # Composite sensor, rather than the hotter controller sensor.\n\
    \                    ssd.append(float((folder / 'temp1_input').read_text()) /\
    \ 1000)\n            result['cpu_c'], result['ssd_c'] = max(cpu), max(ssd)\n \
    \           gpu = subprocess.check_output(['nvidia-smi', '--query-gpu=temperature.gpu',\n\
    \                                           '--format=csv,noheader,nounits'],\
    \ timeout=1.5, text=True)\n            result['gpu_c'] = max(float(v) for v in\
    \ gpu.splitlines())\n            mem = dict((line.split(':', 1)[0], line.split(':',\
    \ 1)[1].strip())\n                       for line in (self.proc_root / 'meminfo').read_text().splitlines())\n\
    \            result['available_gib'] = int(mem['MemAvailable'].split()[0]) / 1024**2\n\
    \            ticks = list(map(int, (self.proc_root / 'stat').read_text().splitlines()[0].split()[1:9]))\n\
    \            total, idle = sum(ticks), ticks[3] + ticks[4]\n            if self.previous_cpu:\n\
    \                dt, di = total - self.previous_cpu[0], idle - self.previous_cpu[1]\n\
    \                result['cpu_percent'] = 100 * (1 - di / dt) if dt > 0 else 0\n\
    \            self.previous_cpu = (total, idle)\n            vm = dict(line.split()\
    \ for line in (self.proc_root / 'vmstat').read_text().splitlines())\n        \
    \    swap = int(vm['pswpout'])\n            result['swapout_total'] = swap\n \
    \           result['swapout_pages'] = 0 if self.previous_swap is None else max(0,\
    \ swap - self.previous_swap)\n            self.previous_swap = swap\n        \
    \    pressure = (self.proc_root / 'pressure/memory').read_text().splitlines()\n\
    \            full = next(line for line in pressure if line.startswith('full '))\n\
    \            result['memory_pressure_full'] = float(dict(v.split('=') for v in\
    \ full.split()[1:])['avg10'])\n            result['valid'] = 'cpu_percent' in\
    \ result\n        except (OSError, ValueError, KeyError, StopIteration, subprocess.SubprocessError):\n\
    \            # Never treat a sensor failure as a safe zero temperature.\n    \
    \        result['error'] = 'required hardware sensor unavailable'\n        return\
    \ result\n\n\ndef serve(args):\n    sensors = Sensors(args.sys_root, args.proc_root)\n\
    \    latest = {'valid': False}\n    armed_until = 0\n    tripped = False\n   \
    \ trip_reason = None\n    runtime_window = SafetyWindow()\n    def pause_ocr(reason):\n\
    \        nonlocal tripped, trip_reason\n        token = Path('/var/run/secrets/kubernetes.io/serviceaccount/token').read_text().strip()\n\
    \        context = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')\n\
    \        request = urllib.request.Request('https://kubernetes.default.svc/apis/apps/v1/namespaces/pfa/deployments/ocr-service/scale',\n\
    \            data=b'{\"spec\":{\"replicas\":0}}', method='PATCH', headers={\n\
    \                'Authorization':'Bearer '+token,'Content-Type':'application/merge-patch+json'})\n\
    \        with urllib.request.urlopen(request,context=context,timeout=2) as response:\n\
    \            response.read()\n        tripped = True\n        trip_reason = reason\n\
    \    def update():\n        nonlocal latest\n        while True:\n           \
    \ reading = sensors.sample()\n            reason = runtime_window.check(reading)\n\
    \            reading['thermal_warning'] = dict(runtime_window.hot)\n         \
    \   reading['safety_events'] = list(runtime_window.events)\n            if time.monotonic()\
    \ < armed_until and reason and not tripped:\n                try:\n          \
    \          pause_ocr(reason)\n                except Exception:\n            \
    \        reading['ocr_pause_failed'] = True\n            reading['test_armed']\
    \ = time.monotonic() < armed_until\n            reading['ocr_paused'] = tripped\n\
    \            reading['safety_trip'] = trip_reason\n            reading['guard_policy']\
    \ = dict(thermal_seconds=THERMAL_CONFIRM_SECONDS, critical=CRITICAL)\n       \
    \     latest = reading\n            time.sleep(0.5)\n    threading.Thread(target=update,\
    \ daemon=True).start()\n    class Handler(BaseHTTPRequestHandler):\n        def\
    \ do_GET(self):\n            if self.path != '/health':\n                self.send_error(404)\n\
    \                return\n            body = json.dumps(latest).encode()\n    \
    \        self.send_response(200 if latest.get('valid') else 503)\n           \
    \ self.send_header('Content-Type', 'application/json')\n            self.send_header('Cache-Control',\
    \ 'no-store')\n            self.send_header('Content-Length', str(len(body)))\n\
    \            self.end_headers()\n            self.wfile.write(body)\n        def\
    \ do_POST(self):\n            nonlocal armed_until, runtime_window, trip_reason,\
    \ tripped\n            if self.path == '/arm' and not violation(latest, starting=True):\n\
    \                runtime_window = SafetyWindow()\n                trip_reason\
    \ = None\n                tripped = False\n                latest['safety_trip']\
    \ = None\n                latest['ocr_paused'] = False\n                armed_until\
    \ = time.monotonic() + 600\n            elif self.path == '/disarm':\n       \
    \         armed_until = 0\n            elif self.path == '/trip':\n          \
    \      # This private endpoint is reachable only from the CI runner.\n       \
    \         # A missing sensor is also a valid reason to pause GPU work.\n     \
    \           try:\n                    pause_ocr('load supervisor requested stop')\n\
    \                except Exception:\n                    self.send_error(503)\n\
    \                    return\n                armed_until = 0\n            else:\n\
    \                self.send_error(409)\n                return\n            self.send_response(204)\n\
    \            self.end_headers()\n        def log_message(self, *unused):\n   \
    \         pass\n    ThreadingHTTPServer(('0.0.0.0', args.port), Handler).serve_forever()\n\
    \n\ndef terminate(process):\n    if process.poll() is not None:\n        return\n\
    \    try:\n        os.killpg(process.pid, signal.SIGTERM)\n    except ProcessLookupError:\n\
    \        process.wait(timeout=2)\n        return\n    try:\n        process.wait(timeout=1)\n\
    \    except subprocess.TimeoutExpired:\n        try:\n            os.killpg(process.pid,\
    \ signal.SIGKILL)\n        except ProcessLookupError:\n            pass\n    \
    \    process.wait(timeout=2)\n\n\ndef supervise(args):\n    sensors = Sensors()\
    \ if args.local_sensors else None\n    def sample():\n        if sensors:\n  \
    \          return sensors.sample()\n        try:\n            with urllib.request.urlopen(args.health_url,\
    \ timeout=1.5) as response:\n                reading = json.load(response)\n \
    \               return reading if isinstance(reading, dict) else {'valid':False}\n\
    \        except Exception:\n            return {'valid': False}\n    report =\
    \ dict(verdict='REFUSED', limits=LIMITS, start_limits=START, critical_limits=CRITICAL,\n\
    \                  thermal_confirmation_seconds=THERMAL_CONFIRM_SECONDS,\n   \
    \               cool_seconds=COOL_SECONDS, samples=0, peaks={}, reason='preflight\
    \ incomplete')\n    process = None\n    armed = False\n    preflight_window =\
    \ SafetyWindow(starting=True)\n    runtime_window = SafetyWindow()\n    trace\
    \ = deque(maxlen=120)\n    def remember(reading, phase):\n        row = dict(phase=phase,\
    \ observed_utc=utc(time.time()), sample_utc=utc(reading.get('timestamp')),\n \
    \                  valid=bool(reading.get('valid')))\n        for key in ['timestamp',\
    \ *LIMITS, 'memory_pressure_full', 'swapout_total']:\n            value = reading.get(key)\n\
    \            row[key] = value if isinstance(value, (int, float)) and math.isfinite(value)\
    \ else None\n        trace.append(row)\n        if reading.get('safety_events'):\n\
    \            report['server_events'] = reading['safety_events'][-8:]\n       \
    \ report['samples'] += 1\n    previous_swap = None\n    def swap_active(reading):\n\
    \        nonlocal previous_swap\n        value = reading.get('swapout_total')\n\
    \        if not isinstance(value, int):\n            return True\n        active\
    \ = previous_swap is not None and value > previous_swap\n        previous_swap\
    \ = value\n        return active\n    def control(action):\n        if not getattr(args,\
    \ 'pause_ocr_on_abort', False):\n            return\n        url = args.health_url.rsplit('/health',1)[0]\
    \ + '/' + action\n        request = urllib.request.Request(url, data=b'', method='POST')\n\
    \        with urllib.request.urlopen(request,timeout=2) as response:\n       \
    \     response.read()\n    try:\n        def interrupted(signum, frame):\n   \
    \         raise KeyboardInterrupt\n        for sig in (signal.SIGTERM, signal.SIGINT):\n\
    \            signal.signal(sig, interrupted)\n        # Only fresh, cool intervals\
    \ count. A short spike pauses this clock;\n        # confirmed heat resets it,\
    \ rather than erasing it for one bad sample.\n        cool_seconds = 0\n     \
    \   previous_cool_stamp = None\n        deadline = time.monotonic() + 120\n  \
    \      while time.monotonic() < deadline:\n            reading = sample()\n  \
    \          remember(reading, 'preflight')\n            reason = preflight_window.check(reading)\n\
    \            if invalid_sample(reading) is None and swap_active(reading):\n  \
    \              reason = 'active swap-out'\n            if reason:\n          \
    \      cool_seconds = 0\n                previous_cool_stamp = None\n        \
    \        report['reason'] = reason\n                if preflight_window.immediate\
    \ and ('critical' in reason or invalid_sample(reading)):\n                   \
    \ # First local sample establishes a CPU delta; allow one tick.\n            \
    \        if sensors and sensors.previous_cpu and report['samples'] == 1:\n   \
    \                     time.sleep(0.5)\n                        continue\n    \
    \                return 3\n            elif violation(reading, starting=True)\
    \ is None:\n                if previous_cool_stamp is not None:\n            \
    \        cool_seconds += min(max(0, reading['timestamp'] - previous_cool_stamp),\
    \ FRESH_SECONDS)\n                    if cool_seconds >= COOL_SECONDS:\n     \
    \                   report['preflight_cool_seconds'] = round(cool_seconds, 3)\n\
    \                        try:\n                            control('arm')\n  \
    \                          armed = bool(getattr(args, 'pause_ocr_on_abort', False))\n\
    \                            break\n                        except urllib.error.HTTPError\
    \ as error:\n                            code = error.code\n                 \
    \           error.close()\n                            if code != 409:\n     \
    \                           report['reason'] = 'hardware watchdog could not be\
    \ armed'\n                                return 3\n                         \
    \   # A new hot sample arrived between checking and arming.\n                \
    \            previous_cool_stamp = None\n                        except OSError:\n\
    \                            report['reason'] = 'hardware watchdog could not be\
    \ armed'\n                            return 3\n                previous_cool_stamp\
    \ = reading['timestamp']\n            else:\n                previous_cool_stamp\
    \ = None\n            report['preflight_cool_seconds'] = round(cool_seconds, 3)\n\
    \            time.sleep(0.5)\n        else:\n            report['reason'] = f'cooldown\
    \ incomplete: {cool_seconds:.1f}/{COOL_SECONDS} cool seconds'\n            return\
    \ 3\n        if not args.command:\n            raise ValueError('No guarded command\
    \ supplied')\n        process = subprocess.Popen(args.command, start_new_session=True,\n\
    \                                   env={**os.environ, 'PFA_STRICT_HEALTH_GUARD':'1'})\n\
    \        started = time.monotonic()\n        while process.poll() is None:\n \
    \           reading = sample()\n            remember(reading, 'runtime')\n   \
    \         for key in LIMITS:\n                if isinstance(reading.get(key),\
    \ (int, float)) and math.isfinite(reading[key]):\n                    previous\
    \ = report['peaks'].get(key, reading[key])\n                    report['peaks'][key]\
    \ = min(previous, reading[key]) if key == 'available_gib' else max(previous, reading[key])\n\
    \            reason = runtime_window.check(reading)\n            if swap_active(reading):\n\
    \                reason = 'active swap-out'\n            if time.monotonic() -\
    \ started >= 600:\n                reason = 'ten-minute hard runtime limit'\n\
    \            if reason:\n                report.update(verdict='ABORTED', reason=reason)\n\
    \                terminate(process)\n                try:\n                  \
    \  control('trip')\n                    report['ocr_paused'] = getattr(args, 'pause_ocr_on_abort',\
    \ False)\n                except Exception:\n                    report['ocr_pause_failed']\
    \ = True\n                return 3\n            time.sleep(0.5)\n        final_reading\
    \ = sample()\n        remember(final_reading, 'finished')\n        final_reason\
    \ = runtime_window.check(final_reading)\n        if final_reason:\n          \
    \  report.update(verdict='ABORTED', reason=final_reason)\n            control('trip')\n\
    \            report['ocr_paused'] = getattr(args, 'pause_ocr_on_abort', False)\n\
    \            return 3\n        report.update(verdict='PASS' if process.returncode\
    \ == 0 else 'FAILED', reason='guarded process finished')\n        if process.returncode\
    \ == 0:\n            control('disarm')\n            armed = False\n        else:\n\
    \            control('trip')\n            report['ocr_paused'] = getattr(args,\
    \ 'pause_ocr_on_abort', False)\n        return process.returncode\n    except\
    \ KeyboardInterrupt:\n        report.update(verdict='ABORTED', reason='cancelled')\n\
    \        try:\n            if armed or process:\n                control('trip')\n\
    \        except Exception:\n            report['ocr_pause_failed'] = True\n  \
    \      return 3\n    except Exception as error:\n        report.update(verdict='ABORTED'\
    \ if process else 'REFUSED',\n                      reason=f'watchdog operation\
    \ failed ({type(error).__name__})')\n        try:\n            if armed or process:\n\
    \                control('trip')\n        except Exception:\n            report['ocr_pause_failed']\
    \ = True\n        return 3\n    finally:\n        if process:\n            terminate(process)\n\
    \        elif armed:\n            try:\n                control('disarm')\n  \
    \          except Exception:\n                report['watchdog_disarm_failed']\
    \ = True\n        report['preflight_events'] = list(preflight_window.events)\n\
    \        report['runtime_events'] = list(runtime_window.events)\n        report['recent_samples']\
    \ = list(trace)\n        Path(args.report).write_text(json.dumps(report, indent=2)\
    \ + '\\n')\n        summary = {k:v for k,v in report.items() if k not in ('recent_samples',\
    \ 'preflight_events', 'runtime_events')}\n        summary['recorded_samples']\
    \ = len(trace)\n        print(json.dumps(summary), flush=True)\n\n\ndef main():\n\
    \    p = argparse.ArgumentParser(description=__doc__)\n    commands = p.add_subparsers(dest='mode',\
    \ required=True)\n    server = commands.add_parser('serve')\n    server.add_argument('--sys-root',\
    \ default='/sys')\n    server.add_argument('--proc-root', default='/proc')\n \
    \   server.add_argument('--port', type=int, default=9187)\n    run = commands.add_parser('run')\n\
    \    run.add_argument('--health-url', default='http://laptop-health.pfa-system.svc.cluster.local:9187/health')\n\
    \    run.add_argument('--local-sensors', action='store_true')\n    run.add_argument('--pause-ocr-on-abort',\
    \ action='store_true')\n    run.add_argument('--report', required=True)\n    run.add_argument('command',\
    \ nargs=argparse.REMAINDER)\n    args = p.parse_args()\n    if args.mode == 'serve':\n\
    \        serve(args)\n        return 0\n    if args.command[:1] == ['--']:\n \
    \       args.command = args.command[1:]\n    return supervise(args)\n\n\nif __name__\
    \ == '__main__':\n    raise SystemExit(main())\n"
---
apiVersion: v1
kind: Service
metadata:
  name: laptop-health
  namespace: pfa-system
spec:
  selector:
    app: laptop-health
  ports:
  - name: http
    port: 9187
    targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laptop-health
  namespace: pfa-system
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: laptop-health
  template:
    metadata:
      labels:
        app: laptop-health
        app.kubernetes.io/part-of: personal-finance-assistant
    spec:
      automountServiceAccountToken: true
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: health
        image: 127.0.0.1:30500/finance/ocr-service:6888b3f5f651
        command:
        - python3
        - /guard/laptop_guard.py
        - serve
        - --sys-root
        - /host/sys
        - --proc-root
        - /host/proc
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: utility
        ports:
        - containerPort: 9187
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 9187
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 9187
          periodSeconds: 10
        volumeMounts:
        - name: script
          mountPath: /guard
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: meminfo
          mountPath: /host/proc/meminfo
          readOnly: true
        - name: stat
          mountPath: /host/proc/stat
          readOnly: true
        - name: vmstat
          mountPath: /host/proc/vmstat
          readOnly: true
        - name: pressure
          mountPath: /host/proc/pressure/memory
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: laptop-health-script
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: meminfo
        hostPath:
          path: /proc/meminfo
          type: File
      - name: stat
        hostPath:
          path: /proc/stat
          type: File
      - name: vmstat
        hostPath:
          path: /proc/vmstat
          type: File
      - name: pressure
        hostPath:
          path: /proc/pressure/memory
          type: File
      serviceAccountName: laptop-health
