server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # The app loads its libraries from these three hosts and nothing else.
    # Inline script is forbidden (theme bootstrap and delegated handlers are
    # external); inline style is still allowed because the views build style
    # attributes, which is far less dangerous than script.
    set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Reverse-proxy API calls to the gateway ────────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://api-gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE Support (disable buffering and use HTTP/1.1)
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;

        # Bill upload can be large
        client_max_body_size 12M;
    }

    # ── Never cache index.html — always serve the latest entry point ──────────
    # add_header does not inherit into a location that defines its own, so the
    # security headers are repeated here.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        expires 0;
    }

    # ── Disable caching for static assets ─────────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        expires 0;
    }

    # ── SPA fallback — all unknown paths serve index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
