# In-cluster CI: the registry, rootless BuildKit and the self-hosted GitHub
# Actions runner. The one-time host setup (containerd's mTLS registry config in
# /etc/rancher/k3s/registries.yaml plus the certificates it names) is not a
# Kubernetes object and stays manual: sudo ./k8s/ci/setup-registry.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-ci
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: personal-finance-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: pfa-ci
  source:
    repoURL: https://github.com/verginjose/Personal-Finance-Assistant.git
    targetRevision: master
    path: k8s/ci
  destination:
    server: https://kubernetes.default.svc
    namespace: pfa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: registry
      namespace: pfa
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "registry") | .env[]? | select(.name == "REGISTRY_STORAGE_MAINTENANCE_READONLY") | .value
