          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 8
          }
        },
        {
          "id": 11,
          "title": "Latency p50 / p95 / p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{job=\"$service\"}[5m])) by (le)) * 1000",
              "refId": "A",
              "legendFormat": "p50",
              "instant": false,
              "range": true
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"$service\"}[5m])) by (le)) * 1000",
              "refId": "B",
              "legendFormat": "p95",
              "instant": false,
              "range": true
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"$service\"}[5m])) by (le)) * 1000",
              "refId": "C",
              "legendFormat": "p99",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 8
          }
        },
        {
          "id": 12,
          "title": "JVM heap \u2014 used vs max",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{job=\"$service\",area=\"heap\"}) / 1024 / 1024",
              "refId": "A",
              "legendFormat": "used",
              "instant": false,
              "range": true
            },
            {
              "expr": "sum(jvm_memory_max_bytes{job=\"$service\",area=\"heap\"}) / 1024 / 1024",
              "refId": "B",
              "legendFormat": "max",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 17
          }
        },
        {
          "id": 13,
          "title": "GC pause per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "targets": [
            {
              "expr": "sum(rate(jvm_gc_pause_seconds_sum{job=\"$service\"}[1m])) * 1000",
              "refId": "A",
              "legendFormat": "pause",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 17
          }
        },
        {
          "id": 15,
          "title": "Slowest endpoints (p95 ms)",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "targets": [
            {
              "expr": "topk(10, histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"$service\",uri!~\"UNKNOWN|NOT_FOUND|root\"}[5m]))) * 1000)",
              "refId": "A",
              "instant": true,
              "format": "table",
              "legendFormat": "{{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 1,
              "color": {
                "mode": "continuous-GrYlRd"
              }
            }
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "valueMode": "text",
            "namePlacement": "left",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 26
          }
        },
        {
          "id": 16,
          "title": "Redis cache hit ratio by service",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(cache_gets_total{result=\"hit\"}[5m])) / clamp_min(sum by (job) (rate(cache_gets_total[5m])), 0.000001)",
              "refId": "A",
              "legendFormat": "{{job}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
