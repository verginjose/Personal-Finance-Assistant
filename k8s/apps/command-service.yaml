apiVersion: v1
kind: Service
metadata:
  name: command-service
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: command-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
# Non-secret configuration for this service only. Credentials live in the
# command-service-secrets Secret, rendered by k8s/apply.sh from
# env/command-service.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: command-service-config
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: guest
  ANALYTICS_SERVICE_URL: http://query-service:8084
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseZGC -XX:+ZGenerational -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-service
  namespace: pfa
  labels:
    app: command-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-service
  template:
    metadata:
      labels:
        app: command-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: command-service
          image: 127.0.0.1:30500/finance/command-service:f9ca1a3d641c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: command-service-config
            - secretRef:
                name: command-service-secrets
          env:
            # Write side of CQRS: always hits the primary.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-primary:5432/$(DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              value: $(DB_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(DB_PASSWORD)
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
            - name: SPRING_DATASOURCE_HIKARI_SCHEMA
              value: $(FINANCE_DB_SCHEMA)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Host has 16 vCPU; 3 keeps the write path responsive under the
              # 50-user scenario while leaving cores for the desktop.
              cpu: "3"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
