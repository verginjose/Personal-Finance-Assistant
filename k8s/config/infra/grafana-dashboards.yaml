    {
      "uid": "pfa-pods",
      "title": "Pods \u2014 CPU / memory / restarts",
      "tags": [
        "pods",
        "cadvisor",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus-ds"
            },
            "query": {
              "query": "label_values(container_memory_working_set_bytes, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(container_memory_working_set_bytes, namespace)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "current": {
              "text": "pfa",
              "value": [
                "pfa"
              ]
            }
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus-ds"
            },
            "query": {
              "query": "query_result(max by (pod) (container_last_seen{namespace=~\"$namespace\"}) > time() - 120)",
              "refId": "pod"
            },
            "definition": "query_result(max by (pod) (container_last_seen{namespace=~\"$namespace\"}) > time() - 120)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "regex": "/pod=\"([^\"]+)\"/",
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "CPU used (cores)",
          "description": "Cores actually used right now, summed over the selected pods.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-ds"
              },
              "expr": "sum((rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[5m])) and on(pod) (max by (pod) (container_last_seen{namespace=~\"$namespace\"} @ end()) > scalar(max(timestamp(container_last_seen{namespace=~\"$namespace\"} @ end()))) - 120))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Memory used",
          "description": "Working set \u2014 memory the containers actually hold.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-ds"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "id": 2,
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
