# Rust authentication; existing database, BCrypt and Redis session formats retained.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: management
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
data:
  REDIS_HOST: redis
  COOKIE_SECURE: 'true'
  SERVICE_MODE: auth
  # Load-test switch: skip the /internal/verify token buckets so a capacity
  # ladder measures the services, not the limiter. Remove to restore limits.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pfa
  labels:
    app: auth-service
    app.kubernetes.io/part-of: personal-finance-assistant
spec:
  revisionHistoryLimit: 3
  # 2 replicas: auth is stateless (sessions in Redis), so a login burst is
  # spread across two accept paths instead of one.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: personal-finance-assistant
      annotations:
        reloader.stakater.com/auto: 'true'
    spec:
      terminationGracePeriodSeconds: 20
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      containers:
        - name: auth-service
          image: 127.0.0.1:30500/finance/auth-service:47502e21fa45@sha256:0784d903d9b57d9b7be51f7c2b4116fccbd5c2f64a6bf6891cca43341bddc77f
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8082
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets
          env:
            - name: DB_HOST
              value: postgres-primary
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/postgres-ca/ca.crt
          resources:
            requests:
              cpu: 150m
              memory: 32Mi
            limits:
              cpu: '4'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-ca
          configMap:
            name: postgres-ca
